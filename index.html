<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cờ cá ngựa Tây Du Ký: bốn giới Ma, Phật, Nhân, Thiên tranh đường về Tây Thiên.">
<meta name="theme-color" content="#15101b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thỉnh Kinh">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cờ Thỉnh Kinh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Yeseva+One&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&text=%E5%A4%A9%E4%BD%9B%E4%BA%BA%E9%AD%94%E7%B6%93%E5%BE%8B%E7%89%8C%E7%AC%A6%E6%A3%8B%E9%9F%B3%E6%A8%82%E6%96%B0%E9%8F%A1&display=swap">
<style>
/* Layout: lacquer table — square board on the left, a scroll-like side panel on the right; stacks on phones. Single dark "sơn mài" look. */
:root{
  color-scheme:dark;
  --lac:#15101b; --lac2:#1f1828; --lac3:#2a2134; --line:#3a2f47;
  --gold:#d6ab52; --gold2:#f3d791;
  --silk:#efe2c4; --silk-line:#b99c62;
  --text:#f1e9da; --muted:#ab9fb3;
  --ma:#d1432f; --phat:#e3a514; --nhan:#3f9d5b; --thien:#3a7bd0;
  --f-disp:"Yeseva One","Noto Serif TC",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
}
body{
  background:var(--lac); color:var(--text); font-family:var(--f-body); font-size:14px; line-height:1.5;
  background-image:
    radial-gradient(ellipse 70% 50% at 15% -10%, rgba(214,171,82,.16), transparent 60%),
    radial-gradient(ellipse 60% 50% at 105% 105%, rgba(58,123,208,.12), transparent 60%),
    radial-gradient(ellipse 90% 60% at 50% 120%, rgba(209,67,47,.10), transparent 65%),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27140%27%20viewBox%3D%270%200%20180%20140%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23d6ab52%27%20stroke-opacity%3D%27.075%27%20stroke-width%3D%271.5%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M18%2052c-2-10%2010-15%2017-8%202-13%2019-14%2021-2%209-3%2015%207%208%2013z%27/%3E%3Cpath%20d%3D%27M35%2044c1%205%206%206%208%202%27/%3E%3Cpath%20d%3D%27M24%2054c0-5%205-6%207-3%27/%3E%3Cpath%20d%3D%27M104%20118c-2-10%2010-15%2017-8%202-13%2019-14%2021-2%209-3%2015%207%208%2013z%27/%3E%3Cpath%20d%3D%27M121%20110c1%205%206%206%208%202%27/%3E%3Cpath%20d%3D%27M110%20120c0-5%205-6%207-3%27/%3E%3C/g%3E%3Cg%20fill%3D%27%23d6ab52%27%20fill-opacity%3D%27.05%27%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2730%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%27100%27%20r%3D%271.6%27/%3E%3C/g%3E%3C/svg%3E");
  background-attachment:fixed;
  min-height:100%;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{
  max-width:1220px; margin:0 auto;
  padding-block:18px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; grid-template-columns:minmax(0,1fr); gap:18px;
}
.app{grid-template-areas:"top" "stage" "side" "left"}
.top{grid-area:top} .stage{grid-area:stage} .side{grid-area:side} .left{grid-area:left; display:flex; flex-direction:column; gap:14px; min-width:0}
/* máy tính vừa: bàn cờ + cột phải, trò chuyện và nhật ký nằm dưới bàn cờ */
@media (min-width:761px){ .app{max-width:1500px; grid-template-columns:minmax(0,1fr) 330px; grid-template-areas:"top top" "stage side" "left side"; align-items:start}
  .side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px)} }
/* máy tính rộng: trái là trò chuyện, nhật ký · giữa là bàn cờ · phải là lượt chơi, bài, tứ giới */
@media (min-width:1180px){ .app{grid-template-columns:300px minmax(0,1fr) 330px; grid-template-areas:"top top top" "left stage side"}
  .left,.side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px); max-height:calc(100vh - 24px)}
  .left .logp{flex:1; min-height:0; display:flex; flex-direction:column} .left .logp #log{max-height:none; flex:1}
  .left #chatPanel .chat-list{max-height:min(34vh,320px)}
  .side{overflow:auto; scrollbar-width:thin} }

.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px; padding-bottom:18px; position:relative}
.top::after{content:""; position:absolute; left:0; right:0; bottom:0; height:8px; background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2716%27%20height%3D%278%27%20viewBox%3D%270%200%2016%208%27%3E%3Cpath%20d%3D%27M1%207V1h12v5H7V3.5%27%20fill%3D%27none%27%20stroke%3D%27%23d6ab52%27%20stroke-width%3D%271.2%27%20stroke-opacity%3D%27.75%27/%3E%3C/svg%3E") repeat-x left center/16px 8px; border-top:1px solid rgba(214,171,82,.35); border-bottom:1px solid rgba(214,171,82,.35)}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.seal{width:52px; height:52px; flex:none; border-radius:9px; background:radial-gradient(circle at 35% 30%,#e8583c,#a82a1c); display:grid; place-items:center; font-family:var(--f-han); font-size:31px; color:#fff3dc; box-shadow:inset 0 0 0 2px rgba(255,240,210,.4),inset 0 0 0 5px #b83224,inset 0 0 0 6px rgba(255,240,210,.3),0 4px 14px rgba(209,67,47,.35); transform:rotate(-4deg)}
h1{font-family:var(--f-disp); font-weight:400; font-size:clamp(28px,4.4vw,40px); line-height:1.05; margin:0; letter-spacing:.015em; color:var(--gold2); text-wrap:balance; background:linear-gradient(180deg,#fff0c0 10%,#e3b65a 55%,#b0782a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.tag{margin:5px 0 0; color:#c9b8a0; font-size:12px; letter-spacing:.14em; text-transform:uppercase}
.top-actions{display:flex; flex-wrap:wrap; gap:8px}
.btn{border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line)); background:linear-gradient(180deg,#2c2236,#1d1626); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:500; font-size:13px; transition:background .15s, border-color .15s, box-shadow .2s, transform .15s; box-shadow:inset 0 1px 0 rgba(255,240,210,.07)}
.btn .ic{font-family:var(--f-han); font-size:14px; color:var(--gold); margin-right:6px; display:inline-block; transform:translateY(1px)}
.btn.primary .ic{color:#5a1a10}
.btn:active{transform:translateY(1px)}
.btn:hover{border-color:var(--gold); background:linear-gradient(180deg,#372a43,#241b2e); box-shadow:inset 0 1px 0 rgba(255,240,210,.1),0 0 14px rgba(214,171,82,.18)}
.btn:focus-visible,.pc:focus-visible,.opt:focus-visible{outline:2px solid var(--gold2); outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#f3d791,#d6a64a 60%,#b9862e); color:#2a1608; border-color:#f3d791; font-weight:700; box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 12px rgba(214,171,82,.3)}
.btn.primary:hover{background:linear-gradient(180deg,#fff0c0,#e3b65a 60%,#c4923a); box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 20px rgba(243,215,145,.45)}
.btn[disabled]{opacity:.45; cursor:not-allowed}

.stage{min-width:0}
.board-wrap{width:100%; max-width:min(860px, calc(100vh - 150px)); min-width:min(100%, 320px); margin-inline:auto; aspect-ratio:1}
.board-wrap{position:relative}
#board{width:100%; height:100%; display:block; user-select:none; -webkit-user-select:none}
#b3d{position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:10px; touch-action:none; cursor:grab}
.tip{position:absolute; transform:translate(-50%,calc(-100% - 14px)); pointer-events:none; background:var(--lac3); border:1px solid var(--gold); color:var(--text); font-size:12px; padding:4px 9px; border-radius:7px; white-space:nowrap}
.viewbtn{margin-left:4px}
.galview{position:relative; width:100%; aspect-ratio:4/3; max-height:52vh; border-radius:12px; overflow:hidden; background:var(--lac3); margin:6px 0 4px}
#galcv{width:100%; height:100%; display:block; touch-action:none}
.galcap{position:absolute; left:12px; bottom:10px; right:12px; font-size:13px; text-shadow:0 1px 3px #000}
.galcap span{color:var(--muted)}
.galchips{display:flex; flex-wrap:wrap; gap:6px}
.galbtn{padding:6px 11px; font-size:12.5px; font-weight:500}
.galbtn.on{border-color:var(--cc); background:color-mix(in srgb, var(--cc) 30%, var(--lac3))}
.legend{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; margin-top:12px; color:var(--muted); font-size:12.5px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{font-style:normal; font-family:var(--f-han); width:20px; height:20px; display:grid; place-items:center; border-radius:4px; background:var(--lac3); font-size:13px}

body.calm .knglow,body.calm .kglow,body.calm .rays,body.calm .flame,body.calm .halo,body.calm .talis,body.calm .wave,body.calm .cloud,body.calm .twk,body.calm .tcrays,body.calm .bdie .ring,body.calm .bdie.can .die,body.calm .mb-die.go .die,body.calm .bring.on,body.calm .tok.can .tok-ring,body.calm .mh-seals span{animation-play-state:paused!important}
.lobby-mode{margin:6px 0 10px; padding:8px 12px; border-radius:10px; border:1px solid rgba(214,171,82,.45); background:rgba(214,171,82,.08); font-size:13.5px}
.lobby-mode.adv{border-color:#7fc4ff; background:rgba(58,123,208,.16)}
.updbar{position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:60; display:flex; gap:8px; align-items:center; max-width:min(560px,calc(100% - 24px)); padding:10px 12px; border-radius:12px; background:#2a1d34; border:1px solid #d6ab52; box-shadow:0 10px 30px rgba(0,0,0,.55); font-size:13.5px; line-height:1.4}
.updbar span{flex:1}
.updbar .btn{padding:7px 12px; flex:none}
/* board svg */
.frame{fill:#1f1828; stroke:#e3b65a; stroke-width:.5}
.knglow,.kglow,.halo,.flame,.talis{transform-box:fill-box}
.knglow{transform-origin:center; animation:knPulse 2.8s ease-in-out infinite}
.kglow{transform-origin:center; animation:knPulse 3.6s ease-in-out infinite}
@keyframes knPulse{50%{opacity:.5; transform:scale(.82)}}
.rays{transform-box:fill-box; transform-origin:center; animation:spin 48s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flame{transform-origin:50% 100%; animation:flick 1.2s ease-in-out infinite alternate}
.flame:nth-of-type(2n){animation-duration:.9s; animation-delay:-.4s}
@keyframes flick{to{transform:scaleY(1.2) skewX(5deg)}}
.halo{transform-origin:center; animation:knPulse 4.5s ease-in-out infinite}
.talis{transform-origin:50% 0; animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.wave{animation:waveMove 3.6s ease-in-out infinite alternate}
@keyframes waveMove{to{transform:translateX(-4px)}}
.cloud{animation:cloudMove 9s ease-in-out infinite alternate}
.cloud:nth-of-type(2n){animation-duration:12s; animation-direction:alternate-reverse}
.twk{animation:twk 2.4s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.25}to{opacity:1}}
.tcrays{transform-box:view-box; transform-origin:30px 16px; animation:tcSway 14s ease-in-out infinite alternate}
@keyframes tcSway{from{transform:rotate(-6deg);opacity:.55}to{transform:rotate(6deg);opacity:.95}}
@keyframes cloudMove{to{transform:translateX(3.5px)}}
.pv{fill:none; stroke:#f3d791; stroke-width:.7; stroke-dasharray:1.4 .9; animation:pvDash 1s linear infinite}
.pv-fill{fill:#f3d791; opacity:.22}
@keyframes pvDash{to{stroke-dashoffset:-4.6}}
.cell{stroke:var(--silk-line); stroke-width:.35}
.kn{stroke-width:.9}
.kn.flash{animation:knflash .9s ease 2}
@keyframes knflash{50%{filter:brightness(2.2)}}
.han{font-family:var(--f-han); font-weight:700; text-anchor:middle; dominant-baseline:central}
.blabel{font-family:var(--f-body); font-size:3.3px; font-weight:700; letter-spacing:.06em; text-anchor:middle; fill:#fff7e6; paint-order:stroke; stroke:rgba(0,0,0,.55); stroke-width:.7px}
.bring{fill:none; stroke-width:.8; opacity:.4}
.bring.on{opacity:1; stroke-width:1.4; animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{stroke-opacity:.35}}
.tok{transition:transform .16s ease; outline:none}
.tok-body{stroke:none}
.tok-rim{fill:none; stroke:#fff4d8; stroke-width:.55}
.tok-t{font-family:var(--f-body); font-size:2.7px; font-weight:700; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.tok-ring{fill:none; stroke:transparent; stroke-width:.8}
.tok-shield{fill:none; stroke:transparent; stroke-width:.7; stroke-dasharray:1.2 .8}
.tok.sh .tok-shield{stroke:var(--gold2)}
.tok.can{cursor:pointer}
.tok.can .tok-ring{stroke:var(--gold2); animation:ring 1s ease-in-out infinite}
.tok.done .tok-rim{stroke:var(--gold2)}
@keyframes ring{50%{stroke-opacity:.2}}

/* side */
.side{display:flex; flex-direction:column; gap:14px; min-width:0}
.panel{background:linear-gradient(170deg,#241b2e,#1b1424 70%); border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line)); border-radius:12px; padding:16px; position:relative; box-shadow:0 8px 24px rgba(0,0,0,.25)}
.panel::before{content:""; position:absolute; inset:5px; border:1px solid rgba(214,171,82,.13); border-radius:8px; pointer-events:none}
.panel h3{margin:0 0 10px; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#cdb98f; font-weight:600; display:flex; align-items:center; gap:8px}
.panel h3::before{content:""; width:7px; height:7px; flex:none; transform:rotate(45deg); background:var(--gold); box-shadow:0 0 8px rgba(214,171,82,.6)}
.panel h3::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,rgba(214,171,82,.35),transparent)}
#turn{display:none}
.turn{border-radius:12px; overflow:hidden; border:1px solid color-mix(in srgb, var(--fc) 60%, var(--line)); background:linear-gradient(170deg,#241b2e,#1b1424 70%); box-shadow:0 8px 28px rgba(0,0,0,.3),0 0 34px color-mix(in srgb,var(--fc) 18%,transparent)}
.turn-head{display:flex; align-items:center; gap:12px; padding:12px 14px; background:linear-gradient(100deg, color-mix(in srgb, var(--fc) 38%, var(--lac2)), var(--lac2) 85%)}
.turn-head .hg{font-family:var(--f-han); font-size:30px; line-height:1; width:48px; height:48px; display:grid; place-items:center; border-radius:9px; background:var(--fc); color:#fff8e8; flex:none; box-shadow:inset 0 0 0 2px rgba(255,240,210,.4),inset 0 0 0 4px var(--fc),inset 0 0 0 5px rgba(255,240,210,.25),0 0 18px color-mix(in srgb,var(--fc) 50%,transparent)}
.turn-name{font-family:var(--f-disp); font-size:20px; line-height:1.15}
.turn-sub{color:var(--muted); font-size:12.5px}
.turn-body{display:flex; gap:14px; align-items:center; padding:14px}
.die{width:64px; height:64px; flex:none}
.die.plain rect{fill:var(--silk); stroke:var(--gold); stroke-width:1.5}
.die.plain circle{fill:#2a1d12}
.die .die-n,.die .die-q{font-family:var(--f-disp); font-size:20px; text-anchor:middle; dominant-baseline:central; fill:#2a1d12}
.die.big{width:72px; height:72px}
.last-die .die{width:44px; height:44px; opacity:.9}
.roll-hint{font-size:12.5px; color:var(--gold2); border:1px dashed rgba(243,215,145,.5); border-radius:8px; padding:6px 10px}
.status{font-size:13.5px; margin:0 0 10px}
.acts{display:flex; flex-wrap:wrap; gap:8px}
.hand-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px}
.pc{--cc:var(--gold); position:relative; overflow:hidden; text-align:left; display:flex; flex-direction:column; gap:4px; padding:10px 11px 11px; border-radius:10px; cursor:pointer; border:1px solid color-mix(in srgb, var(--cc) 60%, transparent); background:linear-gradient(170deg, color-mix(in srgb, var(--cc) 26%, var(--lac2)), var(--lac2) 70%); min-width:0; transition:transform .15s, box-shadow .15s}
.pc:hover:not([disabled]){transform:translateY(-3px) rotate(-.5deg)}
.pc[disabled]{opacity:.5; cursor:default}
.pc::after{content:attr(data-han); position:absolute; right:-2px; bottom:-16px; font-family:var(--f-han); font-size:70px; line-height:1; color:var(--cc); opacity:.13; pointer-events:none}
.pc::before{content:""; position:absolute; inset:4px; border:1px solid color-mix(in srgb,var(--cc) 30%,transparent); border-radius:7px; pointer-events:none}
.pc:hover:not([disabled]){border-color:var(--cc); box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 18px color-mix(in srgb,var(--cc) 35%,transparent)}
.pc .kind{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:color-mix(in srgb, var(--cc) 70%, white)}
.pc .nm{font-family:var(--f-disp); font-size:15.5px; line-height:1.2}
.pc .tx{font-size:12px; color:var(--muted); line-height:1.4}
.pc .when{margin-top:auto; padding-top:4px; font-size:11px; color:var(--text); opacity:.75}
.note{color:var(--muted); font-size:12.5px; margin:8px 0 0}
.empty{color:var(--muted); font-size:13px; margin:0}
.pl{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:8px 6px; border-radius:8px}
.pl+.pl{border-top:1px solid var(--line)}
.pl.cur{background:var(--lac3)}
.pl .chip{width:30px; height:30px; border-radius:6px; display:grid; place-items:center; font-family:var(--f-han); font-size:17px; color:#fff8e8}
.pl .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pl .meta{grid-column:2/4; display:flex; flex-wrap:wrap; gap:4px 10px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.dots{display:flex; gap:4px; align-items:center}
.dot{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--fc); background:transparent}
.dot.out{background:color-mix(in srgb, var(--fc) 45%, transparent)}
.dot.home{background:var(--fc)}
.dot.done{background:var(--gold2); border-color:var(--gold2)}
.badge{font-size:10.5px; padding:1px 7px; border-radius:99px; background:var(--lac3); border:1px solid var(--line); color:var(--text)}
#log{list-style:none; margin:0; padding:0; max-height:240px; overflow:auto; display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:#d9cfdc}
#log li{padding-left:10px; border-left:2px solid var(--line)}
#log li:first-child{border-left-color:var(--gold); color:var(--text)}
.lc{font-weight:600; color:var(--cc)}

/* modal */
.modal{position:fixed; inset:0; z-index:50; background:rgba(8,5,12,.72); display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); backdrop-filter:blur(3px)}
.sheet{width:min(700px,100%); max-height:100%; overflow:auto; border:1px solid var(--gold); border-radius:14px; padding:30px 26px 24px;

const PATH=(()=>{const a=[[6,0]];let r=6,c=0;
  const mv=[[0,1,6],[-1,0,6],[0,1,2],[1,0,6],[0,1,6],[1,0,2],[0,-1,6],[1,0,6],[0,-1,2],[-1,0,6],[0,-1,6],[-1,0,1]];
  for(const[dr,dc,n]of mv)for(let i=0;i<n;i++){r+=dr;c+=dc;a.push([r,c]);}return a;})();
const START=[1,15,29,43];
const HOME=[0,1,2,3].map(f=>Array.from({length:6},(_,i)=>[[7,1+i],[1+i,7],[7,13-i],[13-i,7]][f]));
const KNIDX={6:0,20:1,34:2,48:3};

const DIR_ROT=[0,90,180,270];

/* ---------- Vòng đường đang mở ----------
   Ô trên vòng đánh số tuyệt đối: 0..55 là đường truyền thống, 100.. là Lối đi riêng.
   Khi Lối đi riêng mở ở chuồng b: 11 ô bao quanh chuồng b (từ ô xuất quân tới sát góc trên) bị đóng,
   thay bằng 19 ô uốn khúc xuyên qua chuồng. Mọi nhà cùng dài thêm 8 ô. */
const DET_T=[[5,0],[5,1],[5,2],[5,3],[5,4],[4,4],[3,4],[3,3],[3,2],[3,1],[3,0],[2,0],[1,0],[1,1],[1,2],[1,3],[1,4],[1,5],[0,5]];
const DLEN=DET_T.length,DID=100,CLOSED_N=11,SIGNK=b=>b%2===0?3:9;
const CAMP_T=[[4.5,45],[12.3,45],[20,45],[27.7,45],[35.5,45]];
const rotRC=([r,c],k)=>{for(let i=0;i<k;i++)[r,c]=[c,14-r];return [r,c]};
const rotXY=([x,y],k)=>{for(let i=0;i<k;i++)[x,y]=[150-y,x];return [x,y]};
const detB=()=>G&&G.det?G.det.b:-1;
const isClosed=(i,b)=>{if(b<0||i>=DID)return false;const k=(i-14*b+56)%56;return k>=1&&k<=CLOSED_N};
let RC={key:null};
function ring(){const b=detB();if(RC.key===b)return RC;const R=[];
  for(let i=0;i<56;i++){if(isClosed(i,b))continue;R.push(i);if(b>=0&&i===14*b)for(let k=0;k<DLEN;k++)R.push(DID+k)}
  RC={key:b,R,pos:new Map(R.map((a,i)=>[a,i])),N:R.length,routes:{}};return RC}
const RL=()=>ring().N-1, FIN=()=>ring().N+5;
const startAbs=f=>detB()===f?DID:START[f];
function route(f){const g=ring();if(!g.routes[f]){const s=g.pos.get(startAbs(f));g.routes[f]=Array.from({length:g.N-1},(_,k)=>g.R[(s+k)%g.N])}return g.routes[f]}
const absAt=(f,p)=>route(f)[p];
const posOf=(f,a)=>route(f).indexOf(a);
const absRC=a=>a<DID?PATH[a]:rotRC(DET_T[a-DID],detB());
const absXY=a=>{const[r,c]=absRC(a);return [c*10+5,r*10+5]};
const rdist=(a,b)=>{const g=ring();return (g.pos.get(b)-g.pos.get(a)+g.N)%g.N};
const isStartCell=a=>[0,1,2,3].some(f=>startAbs(f)===a);
function cellRC(f,p){const n=RL(); if(p<n) return absRC(absAt(f,p)); if(p<n+6) return HOME[f][p-n]; return [7,7]; }

    <rect x="25" y="7" width="9" height="32" rx="4.5" fill="#8fad84" stroke="#4d6b48" stroke-width=".5"/>
    <rect x="35.5" y="11" width="8.5" height="28" rx="4.2" fill="#86a37b" stroke="#4d6b48" stroke-width=".5"/>
    <rect x="46" y="21" width="9" height="18" rx="4.5" fill="#7d9a72" stroke="#4d6b48" stroke-width=".5"/>
    <rect x="3" y="29" width="54" height="10" rx="3" fill="#5f7c57"/>
    <rect x="27.4" y="3.5" width="4.2" height="7.5" rx=".4" fill="#f2c94c" class="talis"/>
    <line x1="29.5" y1="4.6" x2="29.5" y2="10" stroke="#b3261e" stroke-width=".6"/>`;
  return thienCung();
}
/* Thiên Cung: Lăng Tiêu Bảo Điện hai tầng mái, hai lầu Nam Thiên Môn, bậc bạch ngọc, mây ngũ sắc, Đông Hải bên dưới */
function thienCung(){
  const roof=(cx,y,w,h,lift)=>{const a=cx-w/2,b=cx+w/2,i=w*.16,l=lift||1.1;
    return `<path d="M${a-l} ${y+h+.15} C${a+i*.35} ${y+h} ${a+i*.7} ${y+h*.45} ${a+i} ${y} L${b-i} ${y} C${b-i*.7} ${y+h*.45} ${b-i*.35} ${y+h} ${b+l} ${y+h+.15} C${b-i*.4} ${y+h+.05} ${b-i*.9} ${y+h-.1} ${b-i*1.1} ${y+h-.15} L${a+i*1.1} ${y+h-.15} C${a+i*.9} ${y+h-.1} ${a+i*.4} ${y+h+.05} ${a-l} ${y+h+.15}Z" fill="url(#tcRoof)" stroke="#7a4f12" stroke-width=".18"/>

/* ---------- Trạng thái ---------- */
let G=null, tokEls=[];
const P=i=>G.players[i];
const tok=o=>P(o.pi).tokens[o.ti];
const mainIdx=o=>absAt(P(o.pi).fac,tok(o).p);
const onRing=t=>t.p>=0&&t.p<RL();
function nm(pi){const pl=P(pi);return `<b style="color:${FAC[pl.fac].hex}">${esc(pl.name)}</b>`}
function tl(o){const f=P(o.pi).fac;return `<b style="color:${FAC[f].hex}">${CHARS[f][o.ti].n}</b>`}
function allTokens(){const a=[];G.players.forEach((pl,pi)=>pl.tokens.forEach((t,ti)=>a.push({pi,ti})));return a}
function occupants(idx){return allTokens().filter(o=>onRing(tok(o))&&mainIdx(o)===idx)}
function ownOnBoard(pi){const F=FIN();return P(pi).tokens.map((t,ti)=>({pi,ti})).filter(o=>tok(o).p>=0&&tok(o).p<F)}
function ownMain(pi){return P(pi).tokens.map((t,ti)=>({pi,ti})).filter(o=>onRing(tok(o)))}
function enemyMain(pi){return allTokens().filter(o=>o.pi!==pi&&onRing(tok(o))&&!tok(o).sh)}
function opps(pi){return G.players.map((_,i)=>i).filter(i=>i!==pi)}
function finished(pi){const F=FIN();return P(pi).tokens.filter(t=>t.p===F).length}
function progress(pi){return P(pi).tokens.reduce((s,t)=>s+Math.max(t.p,0),0)+finished(pi)*60}
function leader(pi){return opps(pi).sort((a,b)=>progress(b)-progress(a))[0]}
function topEnemy(pi){return enemyMain(pi).sort((a,b)=>tok(b).p-tok(a).p)[0]}
function sendHome(o){const t=tok(o);t.p=-1;t.sh=false;markFly(o)}
function canExitTo(pi){const occ=occupants(startAbs(P(pi).fac));return !occ.some(o=>o.pi===pi)&&!occ.some(o=>tok(o).sh)}
function swapOK(a,b){return posOf(P(a.pi).fac,mainIdx(b))>=0&&posOf(P(b.pi).fac,mainIdx(a))>=0}
function knAhead(o){const t=tok(o),f=P(o.pi).fac,n=RL();for(let s=1;t.p+s<n;s++){const idx=absAt(f,t.p+s);if(KNIDX[idx]!==undefined){const occ=occupants(idx);if(occ.some(x=>x.pi===o.pi||tok(x).sh))return null;return t.p+s}}return null}
function pushBack(o,n){const t=tok(o),f=P(o.pi).fac;let np=t.p-n;while(np>=0&&occupants(absAt(f,np)).length)np--;t.p=np<0?-1:np;if(t.p<0)t.sh=false}
function danger(pi,idx){let d=0;const n=RL();for(const o of allTokens()){if(o.pi===pi)continue;const t=tok(o);if(!onRing(t))continue;const dist=rdist(mainIdx(o),idx);if(dist>=1&&dist<=6&&t.p+dist<n)d++}return d}

function legalMoves(pi,d){
  const pl=P(pi),out=[];let exitAdded=false;
  const n=RL(),F=FIN();
  pl.tokens.forEach((t,ti)=>{
    if(t.p===F)return;
    if(t.p<0){ if(EXIT_ROLLS.includes(d)&&!exitAdded&&canExitTo(pi)){out.push({ti,exit:true,to:0});exitAdded=true} return }
    const to=t.p+d; if(to>F)return;
    if(blockedBetween(pi,t.p,to))return;
    if(to<n){const occ=occupants(absAt(pl.fac,to));if(occ.some(o=>o.pi===pi)||occ.some(o=>tok(o).sh))return}
    else if(to<F&&pl.tokens.some(x=>x.p===to))return;
    out.push({ti,to});
  });
  return out;
}
const EXIT_ROLLS=[1,6];
const isBonus=d=>d===1||d===6;
/* Không được vượt qua bất kỳ quân nào nằm giữa đường đi (ô đích được phép có quân địch để đá). */
function blockedBetween(pi,from,to){
  const pl=P(pi),n=RL(),F=FIN();
  for(let p=from+1;p<to;p++){
    if(p<n){if(occupants(absAt(pl.fac,p)).length)return true}
    else if(p<F&&pl.tokens.some(x=>x.p===p))return true;
  }
  return false;
}
function scoreMove(pi,m){
  const f=P(pi).fac,n=RL();let s=0;
  if(m.exit)s+=35;
  if(m.to===FIN())s+=55;else if(m.to>=n)s+=22;
  if(m.to<n){const idx=absAt(f,m.to);const occ=occupants(idx).filter(o=>o.pi!==pi);if(occ.length)s+=50+tok(occ[0]).p*.4;const k=KNIDX[idx];if(k!==undefined)s+=[12,20,14,25][k];s+=detCellScore(pi,idx);s-=danger(pi,idx)*10}
  if(!m.exit){const from=P(pi).tokens[m.ti].p;s+=(m.to-from)*.4+from*.05;if(from<n)s+=danger(pi,absAt(f,from))*7}
  return s+Math.random()*2;
}
function evalBest(pi,d){const ms=legalMoves(pi,d);return ms.length?Math.max(...ms.map(m=>scoreMove(pi,m))):-20}

/* chọn viên còn lại có nước đi (ưu tiên viên prefer, rồi viên lớn hơn); false nếu không viên nào đi được */
function pickDie(prefer){
  const left=dieLeft().sort((a,b)=>G.dv[b]-G.dv[a]);
  const order=prefer!=null&&left.includes(prefer)?[prefer,...left.filter(i=>i!==prefer)]:left;
  for(const i of order){const ms=movesFor(i);if(ms.length){G.dsel=i;G.dice=G.dv[i];G.moves=ms;return true}}
  if(left.length){G.dsel=left[0];G.dice=G.dv[G.dsel]}G.moves=[];return false;
}

  const ms=movesFor(i);if(!ms.length){if(localSeat(G.cur))toast(`Viên ${G.dv[i]} không có nước đi.`);return}

/* tính vị trí mới của mọi quân khi mở lối ở chuồng b (b<0: đóng lối) */
function detRemap(b){
  const oldDet=G.det,oldRL=RL(),oldFIN=FIN();
  const snap=G.players.map(pl=>pl.tokens.map(t=>({p:t.p,abs:onRing(t)?absAt(pl.fac,t.p):null})));
  const closedOn=[];
  if(b>=0)snap.forEach((row,pi)=>row.forEach((s,ti)=>{if(s.abs!=null&&isClosed(s.abs,b))closedOn.push({pi,ti,k:(s.abs-14*b+56)%56})}));
  closedOn.sort((x,y)=>x.k-y.k);
  G.det=b>=0?{b,done:false}:null;
  const nRL=RL(),nFIN=FIN(),out=snap.map(r=>r.map(s=>s.p));
  snap.forEach((row,pi)=>row.forEach((s,ti)=>{const f=P(pi).fac;
    if(s.p<0)return;
    if(s.p===oldFIN){out[pi][ti]=nFIN;return}
    if(s.p>=oldRL){out[pi][ti]=s.p-oldRL+nRL;return}
    const j=closedOn.findIndex(c=>c.pi===pi&&c.ti===ti);
    const a=j>=0?DID+Math.min(j,DLEN-1):s.abs;
    const np=posOf(f,a);out[pi][ti]=np>=0?np:0;
  }));
  G.det=oldDet;
  return {out,moved:closedOn,nRL,oldRL};
}
function remainSum(pi,ps,fin){return ps[pi].reduce((s,p)=>s+(p<0?fin+1:fin-p),0)}
function botDetChoice(pi){
  let best=-1,bs=4;
  for(let b=0;b<4;b++){
    const {out}=detRemap(b),cur=G.players.map(pl=>pl.tokens.map(t=>t.p));
    const oF=FIN(),nF=oF+DLEN-CLOSED_N;let sc=0;
    G.players.forEach((_,i)=>{const extra=remainSum(i,out,nF)-remainSum(i,cur,oF);sc+=i===pi?-1.4*extra:extra*(i===leader(pi)?1.3:1)});
    if(sc>bs){bs=sc;best=b}
  }
  return best;
}

async function executeMove(m){
  showPreview(null);G.busy=true;render();

  if(G.turnId!==tid)return;
  if(ADV()&&G.dv){
    G.du[G.dsel]=1;

    if(left.length&&pickDie()){render();camAfterRoll();return}
    if(left.length)log(`Viên còn lại (${G.dv[left[0]]}) không có nước đi.`);

}

function phaseOK(w,ph){return w==="any"?(ph==="roll"||ph==="move"):w==="pre"?ph==="roll":ph==="move"}
function canPlay(pi,hi){

}

/* ---------- Máy chơi ---------- */
async function botTurn(id){
  await sleep(700);
  if(!G||G.turnId!==id||G.phase!=="roll"||G.winner!=null)return;
  const pi=G.cur;
  await botCard(pi,"roll");
  if(G.winner!=null||G.turnId!==id)return;
  if(G.phase==="roll"){G.busy=true;render();const v=ADV()?await animateRoll2():await animateRoll();G.busy=false;await setRolled(v)}
  await sleep(450);
  if(G.turnId!==id)return;
  await botCard(pi,"move");
  if(G.winner!=null||G.turnId!==id)return;
  await sleep(250);
  await botMoves(id);
}
/* máy (hoặc máy đánh thay) đi hết các viên xúc xắc của lượt hiện tại */
async function botMoves(id){
  const pi=G.cur;
  while(G&&G.turnId===id&&G.phase==="move"&&G.winner==null&&!G.busy){
    let best=null,bs=-1e9;
    if(ADV()&&G.dv){for(const i of dieLeft())for(const m of movesFor(i)){const s=scoreMove(pi,m);if(s>bs){bs=s;best=m}}
      if(best){G.dsel=best.di;G.dice=G.dv[best.di];G.moves=movesFor(best.di);render();await sleep(260)}}
    else for(const m of G.moves){const s=scoreMove(pi,m);if(s>bs){bs=s;best=m}}
    if(!G||G.turnId!==id)return;
    if(!best){await sleep(400);if(G&&G.turnId===id&&G.phase==="move")passTurn();return}
    await executeMove(best);
    if(!ADV())return;
    await sleep(380);
  }
}
async function botCard(pi,ph){
  if(G.cardUsed)return;
  let best=null;
  P(pi).hand.forEach((id,hi)=>{const C=CARDS[id];if(!phaseOK(C.w,ph)||!C.can(pi))return;const r=C.bot(pi);if(r&&r.val>=10&&(!best||r.val>best.val))best={hi,...r}});
  if(best&&Math.random()<.85){await useCard(pi,best.hi,best.args);await sleep(450)}
}

function place(){

  const groups=new Map();

    let key,x,y;
    if(t.p<0){[x,y]=baseSlotXY(pl.fac,ti);key="b"+pi+"_"+ti}
    else{const[r,c]=cellRC(pl.fac,t.p);key=r+"_"+c;x=c*10+5;y=r*10+5}
    if(!groups.has(key))groups.set(key,{x,y,l:[]});groups.get(key).l.push([pi,ti]);
  }));
  const can=selectable();
  for(const g of groups.values()){
    const n=g.l.length;
    g.l.forEach(([pi,ti],i)=>{
      let dx=0,dy=0,s=g.l.length===1&&P(g.l[0][0]).tokens[g.l[0][1]].p<0&&detB()===P(g.l[0][0]).fac?.72:1;

      el.classList.toggle("can",can.has(pi+"_"+ti));

}

  else if(G.phase==="skip"){status="Bị mê hồn, bỏ qua lượt này…"}
  else if(!human){status="Máy đang tính nước đi…"}
  else if(!mine){status=`Đang chờ <b>${esc(pl.name)}</b> đi${NET.mode&&pl.uid&&!isOnline(pl.uid)?" (đang mất kết nối)":""}…`}
  else if(G.phase==="roll"){status=(NET.mode?"Lượt của bạn. ":"")+ROLLTXT();acts=`<span class="roll-hint">Bấm ${ADV()?"hai viên":"viên"} xúc xắc giữa bàn cờ</span>`}
  else if(G.phase==="move"){
    const adv=ADV()&&G.dv,two=adv&&dieLeft().length>1&&G.dv[0]!==G.dv[1];
    if(G.busy)status="Quân đang di chuyển…";
    else if(G.moves.length)status=`Chọn một quân đang sáng để đi <b>${G.dice}</b> bước${two?" · bấm viên kia để đổi số":""}.`;
    else if(adv&&G.du.some(Boolean)){status="Không còn nước đi với số còn lại.";acts=`<button class="btn primary" data-act="pass">Kết thúc lượt</button>`}
    else{status=adv?`Đổ ${G.dv[0]} và ${G.dv[1]} nhưng không có nước đi hợp lệ.`:`Đổ ${G.dice} nhưng không có nước đi hợp lệ.`;acts=`<button class="btn primary" data-act="pass">Bỏ lượt</button>`}
  }
  if(mine&&!G.select&&!G.busy&&G.phase==="roll")short="Lượt của bạn · bấm xúc xắc giữa bàn";
  else if(mine&&!G.select&&!G.busy&&G.phase==="move"&&G.moves.length)short=`Chạm quân đang sáng để đi <b>${G.dice}</b> bước`;
  else short=status.replace(ROLLTXT(),"").replace(" (bấm vào quân đang sáng)."," · chạm quân đang sáng");
  const mob=isMobile(),fresh=G.turnId!==lastTurnShown;
  renderMBar(F,pl,human,mine,short,acts,mob);
  renderBoardDie(F,mine,short,acts,pl,status);
  if(mob&&fresh&&mine&&G.phase==="roll"){const b=$(".board-wrap");if(b){const r=b.getBoundingClientRect();if(r.bottom<60||r.top>innerHeight*.5)b.scrollIntoView({behavior:REDUCE.matches?"auto":"smooth",block:"start"})}}
  el.innerHTML=`<div class="turn${G.turnId!==lastTurnShown?" fresh":""}" style="--fc:${F.hex}">
    <div class="turn-head"><div class="hg">${F.han}</div><div><div class="turn-name">${esc(pl.name)}</div><div class="turn-sub">${F.world} · ${F.realm}${human?(NET.mode&&mine?" · Bạn":""):" · Máy"}</div></div></div>
    <div class="turn-body"><div class="last-die" title="Kết quả xúc xắc">${dieSVG(G.dice)}</div><div style="min-width:0"><p class="status">${status}</p><div class="acts">${acts}</div></div></div></div>`;
  lastTurnShown=G.turnId;
}

function renderBoardDie(F,mine,short,acts,pl,status){
  const w=$("#bdiew");if(!w)return;
  if(!G||!F){w.hidden=true;w.innerHTML="";return}

  const rolling=$("#die")&&$("#die").classList.contains("rolling"),fresh=w.dataset.turn!==String(G.turnId);w.dataset.turn=G.turnId;

  w.hidden=false;w.style.setProperty("--fc",F.hex);

  w.classList.toggle("can",can);w.classList.toggle("dim",!can&&G.phase!=="roll");w.classList.toggle("over",over);
  const extra=acts&&!acts.includes("roll-hint")?acts:"";

  w.innerHTML=`${over?"":`<button id="bdie" class="bdie-btn${fresh&&!rolling?" flip":""}" data-act="roll" ${can||pick?"":"disabled"} aria-label="${can?"Đổ xúc xắc":adv&&G.dv?`Xúc xắc ${FAC[pl.fac].world} ra ${G.dv[0]} và ${G.dv[1]}`:G.dice?`Xúc xắc ${FAC[pl.fac].world} ra ${G.dice}`:`Xúc xắc của ${FAC[pl.fac].world}`}">${can?`<span class="ring" aria-hidden="true"></span>`:""}<span id="die" class="${rolling?"rolling":dieCls()}">${adv?diePair(G.dv?G.dv[0]:null,G.dv?G.dv[1]:null,pl.fac,G.phase==="move"&&G.dv&&dieLeft().length>1?G.dsel:-1,G.dv?G.du:null):dieSVG(G.dice,"big",pl.fac)}</span></button>`}
    <span class="bdie-cap${can?" go":""}" role="status">${cap}</span>${extra?`<span class="bdie-acts">${extra}</span>`:""}`;
}

function onTok(pi,ti){
  if(!G)return;
  if(G.select){if(localSeat(G.select.seat??G.cur)&&G.select.keys.has(pi+"_"+ti)){if(NET.mode==="client"){netIntent("pick",{pi,ti});G.select=null;place()}else resolveSelect({pi,ti})}return}
  if(G.phase!=="move"||G.busy||pi!==G.cur||!localSeat(pi))return;
  const m=G.moves.find(x=>x.ti===ti);if(!m)return;
  if(NET.mode==="client"){netIntent("move",{ti});G.busy=true;showPreview(null);place();renderTurn()}else executeMove(m);
}

  else if(a==="menu")openMenu();

  <li>Lượt đi theo chiều kim đồng hồ: Ma (Hoả Diễm Sơn) → Phật (Linh Sơn) → Nhân (Ngũ Chỉ Sơn) → Thiên (Đông Hải · Thiên Cung).</li>
  <li>Đổ được 1 hoặc 6 thì xuất được quân ra ô cửa có mũi tên. Đổ 1 hoặc 6 cũng được đổ thêm lượt, tối đa hai lượt thêm liên tiếp.</li>
  <li>Không được nhảy qua quân: nếu số xúc xắc lớn hơn số ô tới quân kế tiếp phía trước (của bất kỳ nhà nào), quân đó không đi được. Đi vừa đúng tới ô có quân địch thì đá quân đó.</li>
  <li>Đi hết một vòng rồi rẽ vào đường về màu nhà mình, phải vào ô Kinh bằng đúng số bước.</li>
  <li>Dừng đúng ô có quân địch thì đá quân đó về chuồng và được rút 1 lá bài Phép. Không được dừng lên quân nhà mình.</li></ul>
  <h4>Bốn ô Kỳ Ngộ ở bốn góc vuông</h4><ul>
  ${KNINFO.map((k,i)=>`<li><b style="color:${FAC[i].hex}">${k.n}</b> (${FAC[i].han}): ${k.d}</li>`).join("")}
  <li>Phải dừng đúng trên ô Kỳ Ngộ mới nhận phép.</li></ul>
  <h4>Bài Phép</h4><ul>
  <li>Mỗi nhà khởi đầu 2 lá, giữ tối đa 5 lá, mỗi lượt dùng tối đa 1 lá.</li>
  <li>Thẻ Vàng (Phật) cứu giúp và tăng sức. Thẻ Đỏ (Ma) hại người. Thẻ Lam (Thiên) xoay chuyển cả bàn cờ. Thẻ Lục (Nhân) tác động lên vận may xúc xắc.</li>
  <li>Mỗi lá ghi rõ thời điểm dùng: trước khi đổ, sau khi đổ, hoặc bất cứ lúc nào trong lượt.</li></ul>
  <h4>Thắng</h4><p>Nhà đầu tiên đưa đủ số quân đã chọn (1–5) vào ô Kinh là thắng.</p>
  <h4>Bản Nâng cấp · 2 xúc xắc</h4><ul>
  <li>Mỗi lượt đổ hai viên, mỗi viên đi riêng: có thể cho hai quân khác nhau đi, hoặc một quân đi liền hai lần. Bấm vào một viên để chọn số đang dùng.</li>
  <li>Viên nào ra 1 hoặc 6 thì dùng viên đó để xuất quân. Chỉ đổ đôi mới được thêm lượt.</li>
  <li><b>Đôi 6</b>: được mở <b>Lối đi riêng</b>. Chọn một trong bốn chuồng, Thiên Đình treo biển bảo trì 11 ô đường bao quanh chuồng đó (kể cả ô xuất quân và ô Kỳ Ngộ ở góc). Mọi quân phải đi lối mới 19 ô uốn khúc xuyên qua chuồng, mỗi vòng dài thêm 8 ô. Quân đang đứng trên đoạn bị đóng được dời vào đầu lối mới; quân chưa xuất của nhà có chuồng chuyển ra trại tạm và xuất quân ở ô đầu lối.</li>
  <li><b>Đôi 1</b>: nếu trong Lối đi riêng không còn quân nào, lối đóng lại và đường truyền thống thông như cũ. Mỗi lúc chỉ có một Lối đi riêng.</li></ul>
  <h4>Phụ bản trên Lối đi riêng</h4><ul>
  ${DETQ.map((Q,b)=>`<li><b style="color:${FAC[b].hex}">${FAC[b].realm} · ${Q.q}</b>: ô ${Q.hh} ${Q.hn.toLowerCase()} – ${Q.hd} Ô ${Q.han} ${Q.qn} – ${Q.qd}</li>`).join("")}
  <li>Phải dừng đúng ô mới có tác dụng. Mỗi phụ bản chỉ hoàn thành được một lần mỗi khi lối mở; ai tới trước nhận thưởng.</li></ul>
  <div class="opts"><button class="btn primary" data-act="close">Đã hiểu</button></div>`);
}

/* Cờ Thỉnh Kinh — 20 quân cờ chibi anime dựng bằng khối cơ bản.
   Đơn vị: đế bán kính 1, cao ~2–2.5. Trục Y hướng lên, mặt nhân vật nhìn về +Z.
   opt.outline = viền anime (chỉ dùng trong game, không xuất STL). */
function buildFigure(THREE, f, i, opt) {
  opt = opt || {};
  const PI = Math.PI;
  const root = new THREE.Group();
  let cur = root;
  if (!buildFigure._g) {
    const d = new Uint8Array([110, 110, 110, 255, 178, 178, 178, 255, 236, 236, 236, 255]);
    const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
    t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
    buildFigure._g = t;
  }
  const mats = {};
  const M = c => mats[c] || (mats[c] = new THREE.MeshToonMaterial({ color: c, gradientMap: buildFigure._g }));
  const GOLD = "#e8b84a", INK = "#2a1830", WHITE = "#ffffff";
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  function put(geo, col, p, r, s) {
    const m = new THREE.Mesh(geo, M(col));
    if (p) m.position.set(p[0], p[1], p[2]);
    if (r) m.rotation.set(r[0], r[1], r[2]);
    if (s) m.scale.set(s[0], s[1], s[2]);
    m.castShadow = true; m.receiveShadow = true;
    cur.add(m); return m;
  }
  const ol = m => (m.userData.ol = true, m);
  const sph = (r, col, p, s, rot) => put(new THREE.SphereGeometry(r, 24, 16), col, p, rot, s);
  const cone = (r, h, col, p, rot) => put(new THREE.ConeGeometry(r, h, 16), col, p, rot);
  const cyl = (r1, r2, h, col, p, rot) => put(new THREE.CylinderGeometry(r1, r2, h, 20), col, p, rot);
  const box = (w, h, d, col, p, rot) => put(new THREE.BoxGeometry(w, h, d), col, p, rot);
  const torus = (R, t, col, p, rot, arc) => put(new THREE.TorusGeometry(R, t, 10, 32, arc || PI * 2), col, p, rot);
  const lathe = (pts, col, p) => put(new THREE.LatheGeometry(pts.map(a => new THREE.Vector2(a[0], a[1])), 32), col, p);
  function rod(a, b, r, col) {
    const A = V(a[0], a[1], a[2]), B = V(b[0], b[1], b[2]), d = B.clone().sub(A), L = d.length();
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, L, 6, 12), M(col));
    m.position.copy(A).add(B).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
    m.castShadow = true; m.receiveShadow = true;
    cur.add(m); return m;
  }
  const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

  /* đế */
  const FACC = ["#d1432f", "#e3a514", "#3f9d5b", "#3a7bd0"];
  lathe([[0, 0], [1, 0], [1, .1], [.9, .22], [0, .22]], opt.baseColor || FACC[f]);
  torus(.955, .035, GOLD, [0, .1, 0], [PI / 2, 0, 0]);

  /* thân chibi: đầu to, thân chuông ngắn */
  function body(o) {
    const s = o.s || 1, fat = o.fat || 0, top = .22, H = .74 * s;
    ol(lathe([[0, top], [.48 + fat, top], [.5 + fat, top + .1 * s], [.45 + fat, top + .38 * s], [.33 + fat * .6, top + .6 * s], [.2, top + H - .02], [0, top + H]], o.robe));
    torus(.455 + fat * .95, .04, o.trim, [0, top + .36 * s, 0], [PI / 2, 0, 0]);
    torus(.2, .035, o.trim, [0, top + H - .03, 0], [PI / 2, 0, 0]);
    const hr = (o.headR || .46) * (s < 1 ? .96 : 1), hc = top + H + hr * .86;
    ol(sph(hr, o.skin, [0, hc, 0], [1.04, 1, 1]));
    const shY = top + .6 * s, sw = .26 + fat * .6;
    const hand = o.hands || [[-(.42 + fat), top + .34 * s, .26], [.42 + fat, top + .34 * s, .26]];
    rod([-sw, shY, 0], hand[0], .1, o.sleeve || o.robe);
    rod([sw, shY, 0], hand[1], .1, o.sleeve || o.robe);
    sph(.1, o.skin, hand[0]); sph(.1, o.skin, hand[1]);
    if (!o.noFeet) for (const k of [-1, 1]) sph(.12, o.shoe || "#3a2820", [k * .17, top + .05, .38], [1, .7, 1.3]);
    const b = { top, hc, hr, hand, shY, s, fat, neck: top + H };
    b.z = (x, dy) => Math.sqrt(Math.max(0, hr * hr - (x / 1.04) ** 2 - dy * dy));
    if (!o.noFace) face(b, o);
    return b;
  }
  function face(b, o) {
    const dy = -b.hr * .08, ey = b.hc + dy;
    for (const k of [-1, 1]) {
      const x = k * .17, z = b.z(x, dy);
      if (o.closed) torus(.065, .016, INK, [x, ey, z + .005], [0, 0, o.closed === "happy" ? 0 : PI], PI);
      else {
        sph(.085, o.eye || INK, [x, ey, z - .015], [1, 1.35, .45]);
        sph(.028, WHITE, [x + .03, ey + .045, b.z(x + .03, dy + .045) + .01]);
      }
      sph(.06, "#f6a2a2", [k * .3, ey - .12, b.z(k * .3, dy - .12) - .02], [1, .55, .3]);
    }
    if (o.mouth !== false) {
      const my = dy - .18;
      torus(o.smile || .045, .014, "#8a3434", [0, b.hc + my, b.z(0, my) + .005], [0, 0, PI], PI);
    }
  }
  function hair(b, col, o) {
    o = o || {};
    ol(sph(b.hr * 1.06, col, [0, b.hc + b.hr * .1, -b.hr * .1], [1.04, .96, 1]));
    if (o.bangs !== false) for (let k = -2; k <= 2; k++) {
      const x = k * b.hr * .24, dy = b.hr * (.6 - Math.abs(k) * .06);
      sph(b.hr * .22, col, [x, b.hc + dy, b.z(x, dy) - .02], [1, 1.35, .6], [0, 0, -k * .25]);
    }
    if (o.long) ol(rod([0, b.hc, -b.hr * .7], [0, b.hc - b.hr * 1.5, -b.hr * .85], b.hr * .48, col));
  }
  const ears = (b, col, sc) => { for (const k of [-1, 1]) sph(.09, col, [k * b.hr * 1.03, b.hc - .02, 0], sc || [.6, 1.35, .8]); };
  const staff = (h, y1, col, r) => rod([h[0], .26, h[2]], [h[0], y1, h[2]], r || .055, col);

  const C = [
    /* ===== MA ===== */
    [
      () => { // Ngưu Ma Vương
        const b = body({ robe: "#5a2424", trim: GOLD, skin: "#ffd9c2", fat: .08, eye: "#7a1010" });
        hair(b, "#231a1a");
        for (let k = -1; k <= 1; k++) cone(.1, .28, "#231a1a", [k * .17, b.hc + b.hr * .98, -.06], [0, 0, -k * .45]);
        for (const k of [-1, 1]) {
          rod([k * .36, b.hc + .2, -.02], [k * .62, b.hc + .36, -.02], .075, "#f4e8cc");
          cone(.075, .3, "#f4e8cc", [k * .69, b.hc + .52, -.02], [0, 0, -k * .35]);
          sph(.1, "#ffd9c2", [k * .5, b.hc + .02, -.04], [1.3, .55, .6]);
          sph(.15, "#7a3a2a", [k * .33, b.shY + .02, 0], [1, .7, 1]);
        }
        torus(.05, .015, GOLD, [0, b.hc - .2, b.z(0, -.2) + .01]);
        const h = b.hand[1]; staff(h, 2.2, "#2b2b2b", .06); sph(.1, GOLD, [h[0], 2.24, h[2]]);
      },
      () => { // Thiết Phiến Công Chúa
        const b = body({ robe: "#b8324a", trim: "#f0c24a", skin: "#ffe2cc", eye: "#5a1020", hands: [[-.42, .56, .26], [.44, .84, .3]] });
        hair(b, "#1c1414", { long: true });
        sph(.17, "#1c1414", [0, b.hc + b.hr + .04, -.12]);
        rod([-.24, b.hc + b.hr + .06, -.12], [.24, b.hc + b.hr + .1, -.12], .025, GOLD);
        sph(.05, "#e04a5a", [.24, b.hc + b.hr + .1, -.12]);
        const h = b.hand[1];
        rod(h, add3(h, [.04, .28, 0]), .035, GOLD);
        sph(.42, "#4aa35a", add3(h, [.1, .66, 0]), [.85, 1, .12]);
        rod(add3(h, [.05, .3, .03]), add3(h, [.16, 1.0, .03]), .02, "#2f7a3a");
      },
      () => { // Hồng Hài Nhi
        const b = body({ robe: "#e0402e", trim: "#ffc23a", skin: "#ffe0c4", s: .9, eye: "#8a1a10", smile: .06 });
        hair(b, "#1c1414", { bangs: false });
        sph(.14, "#1c1414", [0, b.hc + b.hr + .02, 0]);
        for (const k of [-1, 1]) sph(.12, "#1c1414", [k * .3, b.hc + b.hr * .72, 0]);
        const h = b.hand[1]; staff(h, 1.95, "#7a4a1a", .05);
        cone(.08, .28, "#e9edf2", [h[0], 2.1, h[2]]);
        cone(.12, .3, "#ff8a2a", [h[0], 1.88, h[2]], [PI, 0, 0]);
        for (let k = 0; k < 3; k++) { const a = PI * .25 + k * PI * .25; cone(.1, .34, k === 1 ? "#ffcf3a" : "#ff7a2a", [Math.cos(a) * .74, .38, Math.sin(a) * .74]); }
      },
      () => { // Bạch Cốt Tinh
        const b = body({ robe: "#f2eee6", trim: "#a3a9b5", skin: "#fff4ee", eye: "#a01a2a" });
        hair(b, "#dcdce8", { long: true });
        sph(.06, "#a01a2a", [-.22, b.hc + b.hr * .75, b.z(-.22, b.hr * .75) - .02]);
        const h = b.hand[1]; staff(h, 1.95, "#e9e4d8", .05);
        sph(.15, "#f4f1e8", [h[0], 2.06, h[2]]);
        for (const k of [-1, 1]) sph(.032, INK, [h[0] + k * .055, 2.08, h[2] + .13]);
      },
      () => { // Hoàng Mi Đại Vương
        const b = body({ robe: "#c09030", trim: "#7a2a1a", skin: "#ffdcc0", fat: .06 });
        for (const k of [-1, 1]) rod([k * .07, b.hc + .1, b.z(.07, .1)], [k * .36, b.hc - .05, b.z(.34, -.05) - .02], .04, "#f5d442");
        for (const k of [-1, 1]) cyl(.26, .26, .05, GOLD, add3(b.hand[k < 0 ? 0 : 1], [k * .06, .1, 0]), [0, 0, PI / 2]);
        torus(.24, .04, "#6b3a12", [0, b.neck, .06], [PI / 2 - .35, 0, 0]);
      },
    ],
    /* ===== PHẬT ===== */
    [
      () => { // Như Lai Phật Tổ — ngồi toà sen
        for (let k = 0; k < 10; k++) { const a = k / 10 * PI * 2; put(new THREE.SphereGeometry(.26, 16, 12), "#f6aab8", [Math.cos(a) * .64, .32, Math.sin(a) * .64], [0, -a, 0], [1, .45, .55]); }
        ol(lathe([[0, .3], [.56, .3], [.53, .48], [.36, .64], [.22, .8], [0, .82]], "#e0a832"));
        for (const k of [-1, 1]) rod([k * .27, .7, 0], [k * .1, .5, .36], .1, "#e0a832");
        sph(.12, "#ffe0b8", [0, .5, .4]);
        const hr = .46, hc = .82 + hr * .86;
        const b = { hr, hc, z: (x, dy) => Math.sqrt(Math.max(0, hr * hr - (x / 1.04) ** 2 - dy * dy)) };
        ol(sph(hr, "#ffe0b8", [0, hc, 0], [1.04, 1, 1]));
        face(b, { closed: true });
        hair(b, "#2b3a6a", { bangs: false });
        sph(.2, "#2b3a6a", [0, hc + hr * .95, -.04]);
        sph(.035, "#d0302a", [0, hc + hr * .3, b.z(0, hr * .3) + .01]);
        ears(b, "#ffe0b8", [.55, 1.6, .7]);
        torus(.66, .05, GOLD, [0, hc, -.46]);
        rod([0, .78, -.3], [0, hc - .66, -.46], .06, GOLD);
      },
      () => { // Quan Âm Bồ Tát
        const b = body({ robe: "#f6f3ec", trim: "#78bfa9", skin: "#ffe6d2", eye: "#3a2a5a" });
        hair(b, "#1c1414");
        ol(sph(b.hr * 1.14, "#f6f3ec", [0, b.hc + .06, -.14], [1.04, 1, 1]));
        ol(rod([0, b.hc, -.32], [0, b.hc - .75, -.36], .26, "#f6f3ec"));
        sph(.05, "#e04a5a", [0, b.hc + b.hr * .66, b.z(0, b.hr * .66) + .02]);
        torus(.07, .02, GOLD, [0, b.hc + b.hr * .66, b.z(0, b.hr * .66)]);
        const h = b.hand[0];
        lathe([[0, 0], [.1, 0], [.14, .1], [.06, .24], [.07, .33], [0, .33]], "#cfe8dc", add3(h, [0, -.06, .02]));
        rod(add3(h, [0, .27, .02]), add3(h, [-.1, .72, .05]), .022, "#5b8f3a");
        for (const dy of [.5, .62, .74]) sph(.05, "#7fbf5a", add3(h, [-.08 + dy * .02, dy, .05]), [1, 1.8, .5], [0, 0, .5]);
      },
      () => { // Nhiên Đăng Cổ Phật — cầm đèn lưu ly
        const b = body({ robe: "#c7782a", trim: "#f0c24a", skin: "#ffe0c0", sleeve: "#e8b84a", closed: true, hands: [[-.42, .56, .26], [.4, .9, .32]] });
        hair(b, "#2b3a6a", { bangs: false });
        sph(.18, "#2b3a6a", [0, b.hc + b.hr * .95, -.04]);
        sph(.035, "#d0302a", [0, b.hc + b.hr * .3, b.z(0, b.hr * .3) + .01]);
        ears(b, "#ffe0c0", [.55, 1.6, .7]);
        torus(.56, .04, "#ffb84a", [0, b.hc, -.42]);
        rod([0, b.neck - .1, -.25], [0, b.hc - .56, -.42], .05, "#ffb84a");
        const h = b.hand[1];
        lathe([[0, 0], [.13, 0], [.05, .08], [.05, .2], [.17, .28], [.15, .36], [0, .36]], GOLD, add3(h, [0, .04, 0]));
        cone(.07, .24, "#ffcf3a", add3(h, [0, .52, 0]));
        cone(.04, .13, "#ff7a2a", add3(h, [0, .47, .03]));
        torus(.16, .03, "#7a3a1a", add3(b.hand[0], [0, -.05, 0]), [PI / 2, 0, 0]);
      },
      () => { // Di Lặc Phật
        const b = body({ robe: "#e8902e", trim: "#c63c2c", skin: "#ffdcb8", fat: .18, closed: "happy", smile: .09 });
        sph(.36, "#ffdcb8", [0, .64, .22], [1, 1, .8]);

function netOnIntent(s){
  const it=s.val();R("intents/"+s.key).remove();

  else if(it.k==="cancel"){if(G.select&&G.select.seat===seat)resolveSelect(null)}
  else if(it.k==="choose"){if(G.choice&&G.choice.seat===seat&&NET.choiceRes){const r=NET.choiceRes;NET.choiceRes=null;G.choice=null;r(+d.i);render()}}
}

function netWatchdog(){

  const uid=P(G.cur).uid;if(isOnline(uid)){NET.offSince[uid]=0;return}

  NET.autoTurn=G.turnId;log(`${nm(G.cur)} mất kết nối, máy đánh thay lượt này.`);
  if(G.choice&&NET.choiceRes){const r=NET.choiceRes;NET.choiceRes=null;G.choice=null;r(0);return}

  const rebuild=!G||!G.players||G.players.length!==s.players.length||G.players.some((p,i)=>p.fac!==s.players[i].fac)||!tokEls.length;
  G={...s,deck:[],discard:[],log:(s.log||[]).map(cleanLog),
    players:s.players.map(p=>({...p,name:String(p.name||"").slice(0,24),hand:p.uid===NET.uid&&p.type==="human"?NET.myHand.slice():Array(p.handN||0).fill(null)})),
    select:s.select?{...s.select,keys:new Set(s.select.keys||[])}:null};
  if(rebuild)buildTokens();
  render();
  if(G.choice&&localSeat(G.choice.seat)){if(NET.choiceShown!==G.choice.id){NET.choiceShown=G.choice.id;openRemoteChoice(G.choice)}}
  else if($("#rchoice"))closeSheet();
  if(G.phase==="over"&&G.winner!=null){if(!NET.overShown){NET.overShown=true;setTimeout(()=>{if(G&&G.phase==="over")openWinSheet()},2100)}}else NET.overShown=false;
  if($("#lobby")&&NET.status!=="lobby")closeSheet();
}

const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
function netErr(e){const c=(e&&(e.code||e.message))||"";
  if(/operation-not-allowed|admin-restricted/.test(c))return "Chưa bật đăng nhập ẩn danh (Anonymous) trong Firebase Authentication.";
  if(/PERMISSION_DENIED|permission/i.test(c))return "Firebase từ chối quyền truy cập. Kiểm tra đã dán luật database.rules.json chưa.";
  if(/timeout|network/i.test(c))return "Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.";
  if(c==="noconfig")return "Chưa cấu hình Firebase.";
  return (e&&e.message)||"Có lỗi kết nối, thử lại.";}
async function netAction(a,b){
  const msg=t=>{const m=$("#netMsg");if(m)m.textContent=t};
  try{
    if(a==="netCreate"){const n=netNameInput();if(!n)return;msg("Đang tạo phòng…");if(NET.code)await netLeave(true);await withTimeout(netCreate(n),20000);await netAfterJoin()}
    else if(a==="netJoin"){const n=netNameInput();if(!n)return;const c=($("#netCode").value||"").trim();if(c.length<5){msg("Mã phòng có 5 ký tự.");return}
      if(NET.code)await netLeave(true);let last="Đang vào phòng…";msg(last);
      try{await withTimeout(netJoin(c,n,t=>{last=t;msg(t)}),20000)}catch(e){if(e.message==="timeout")throw new Error("Bị kẹt ở bước: "+last.replace("…","")+". Kiểm tra mạng"+(INAPP?", hoặc mở link bằng Chrome/Safari thay vì trong Zalo/Messenger":"")+" rồi thử lại.");throw e}
      await netAfterJoin()}
    else if(a==="netLobby")netLobby();
    else if(a==="netLeave"){await netLeave();closeSheet();openSetup("online")}
    else if(a==="netSit")await netSit(+b.dataset.i);
    else if(a==="netStand")await netStand();
    else if(a==="netSeatKind")await R("seats/"+b.dataset.i).set({kind:b.dataset.k});
    else if(a==="netStart")await netStart();
    else if(a==="netAgain"){netAgain()}
    else if(a==="netCopy"){const v=roomLink();try{await navigator.clipboard.writeText(v);toast("Đã sao chép link phòng.")}catch(e){const i=$("#roomLink");if(i){i.focus();i.select()}toast("Hãy sao chép link đang được chọn.")}}
    else if(a==="netShare"){try{await navigator.share({title:"Cờ Thỉnh Kinh",text:"Vào phòng "+NET.code+" chơi Cờ Thỉnh Kinh",url:roomLink()})}catch(e){}}
  }catch(e){const t=netErr(e);msg(t);if(!$("#netMsg"))toast(t);console.warn(e)}
}

/* ---------- Trò chuyện & biểu cảm ----------
   Tin nhắn đi qua nhánh presence/{uid} sẵn có (mỗi người chỉ ghi được vào chỗ của mình), nên không cần đổi luật Firebase. */
const EMO={
  0:[["😈","Ha ha ha!"],["🔥","Lửa Tam Muội!"],["💀","Hù!"],["🌪️","Quạt cho bay!"],["🐂","Ngưu Ma gầm!"],["😏","Để xem…"]],
  1:[["🙏","A Di Đà Phật"],["🌼","Thiện tai!"],["😌","Tâm tịnh"],["😆","Cười khà khà"],["✨","Phật độ!"],["📿","Niệm kinh"]],
  2:[["🐒","Lão Tôn đây!"],["🍑","Đào tiên!"],["🐷","Đói bụng quá…"],["😭","Sư phụ ơi!"],["🐎","Đi tiếp!"],["🎲","Hên quá!"]],
  3:[["⚡","Thiên lôi!"],["👑","Trẫm phán!"],["☁️","Cân đẩu vân"],["🐉","Rồng bay!"],["🌟","Sao trời"],["😎","Ngạo nghễ"]],
  c:[["👍","Hay!"],["😮","Trời!"],["😅","Tiếc quá"],["⏰","Nhanh lên"],["🤝","GG"]]};
const BOT_TAUNT={0:[0,1,4],1:[3,4,0],2:[0,5,4],3:[0,3,5]};
const CHAT={log:[],seen:{},unread:0,lastSend:0,primed:false};
const emoOf=id=>{const [g,i]=String(id).split(":");const set=EMO[g];return set&&set[+i]?{g,i:+i,em:set[+i][0],cap:set[+i][1]}:null};
const rid=()=>Math.random().toString(36).slice(2,10);
/* phe của người đang thao tác trên máy này */
function myFac(){
  if(NET.code){if(G){const s=mySeat();return s>=0?P(s).fac:-1}const k=seatOf(NET.uid);return k!=null?+k:-1}
  return G?P(G.cur).fac:-1;
}
function facOfUid(uid){
  if(G&&G.players){const p=G.players.find(x=>x.uid===uid&&x.type==="human");if(p)return p.fac}
  const k=Object.keys(NET.seats||{}).find(i=>NET.seats[i]&&NET.seats[i].uid===uid);return k!=null?+k:-1;
}
function nameOfUid(uid,fallback){
  if(G&&G.players){const p=G.players.find(x=>x.uid===uid&&x.type==="human");if(p)return p.name}
  const k=facOfUid(uid);if(k>=0&&NET.seats[k]&&NET.seats[k].name)return NET.seats[k].name;
  const pr=NET.pres[uid];return (pr&&pr.name)||fallback||"Khán giả";
}
/* gửi */
function sendEmote(id){
  const now=Date.now();if(now-CHAT.lastSend<700)return;
  const f=myFac(),e=emoOf(id);if(!e||(e.g!=="c"&&+e.g!==f))return;CHAT.lastSend=now;
  if(NET.code){const m={id:rid(),k:"e",e:id,t:now};R("presence/"+NET.uid+"/m").set(m).catch(()=>toast("Chưa gửi được, kiểm tra mạng."));chatShow(m,NET.uid)}
  else chatShow({id:rid(),k:"e",e:id,t:now,as:G?G.cur:null},null);
}
function sendChat(text){
  text=String(text||"").replace(/[\u0000-\u001f\u007f]/g," ").replace(/\s+/g," ").trim().slice(0,120);if(!text||!NET.code)return false;
  const now=Date.now();if(now-CHAT.lastSend<900){toast("Gõ chậm lại một chút nhé.");return false}CHAT.lastSend=now;
  const m={id:rid(),k:"t",x:text,t:now};R("presence/"+NET.uid+"/m").set(m).catch(()=>toast("Chưa gửi được, kiểm tra mạng."));chatShow(m,NET.uid);return true;
}
/* máy cầm quân cũng biết khích tướng */
function botEmote(seat,id){
  if(!G||!P(seat)||P(seat).type!=="bot"||!emoOf(id))return;
  if(NET.mode==="host"){const m={id:rid(),k:"e",e:id,t:Date.now(),as:seat};R("presence/"+NET.uid+"/b").set(m);chatShow(m,NET.uid)}
  else if(!NET.mode)chatShow({id:rid(),k:"e",e:id,t:Date.now(),as:seat},null);
}
function botReact(capturer,victims){
  if(P(capturer).type==="bot"&&Math.random()<.6){const f=P(capturer).fac,l=BOT_TAUNT[f];setTimeout(()=>botEmote(capturer,f+":"+l[Math.floor(Math.random()*l.length)]),650)}
  for(const v of victims)if(P(v.pi).type==="bot"&&Math.random()<.45){setTimeout(()=>botEmote(v.pi,Math.random()<.5?"c:2":P(v.pi).fac===2?"2:3":"c:1"),1500);break}
}
/* nhận: so sánh tin cuối của từng người trong presence */
function chatIngest(pres){
  const first=!CHAT.primed;CHAT.primed=true;
  for(const uid of Object.keys(pres||{}))for(const key of ["m","b"]){
    const m=pres[uid]&&pres[uid][key];if(!m||!m.id)continue;const sk=uid+"/"+key;
    if(CHAT.seen[sk]===m.id)continue;CHAT.seen[sk]=m.id;
    if(uid===NET.uid)continue;
    if(key==="b"&&!(NET.meta&&NET.meta.host===uid))continue;
    chatShow(m,uid,first);
  }
}
function chatShow(m,uid,quiet){
  let fac=-1,name="";
  if(m.as!=null&&G&&P(m.as)){fac=P(m.as).fac;name=P(m.as).name}
  else if(uid){fac=facOfUid(uid);name=nameOfUid(uid,"Khán giả")}
  name=String(name).slice(0,24);
  let e=null,text="";
  if(m.k==="e"){e=emoOf(m.e);if(!e||(e.g!=="c"&&+e.g!==fac))return}
  else if(m.k==="t"){text=String(m.x||"").slice(0,120);if(!text)return}else return;
  const mine=uid&&uid===NET.uid&&m.as==null;
  CHAT.log.push({fac,name,e,text,mine,t:m.t||Date.now()});if(CHAT.log.length>60)CHAT.log.shift();
  renderChatLists();
  if(quiet)return;
  stickerShow(fac,name,e,text);
  const snd=NET.raw?NET.raw.sfx:sfx;
  if(e)snd("emote",fac);else snd("msg");
  if(!mine&&isMobile()&&!$("#chatSheet")&&!$("#lobby")){CHAT.unread++;renderChatFab()}
}
/* hiển thị */
const FAC_COL=f=>f>=0&&FAC[f]?FAC[f].hex:"#9a8fa6";
function chatItemHTML(x){
  const col=FAC_COL(x.fac),han=x.fac>=0?FAC[x.fac].han:"觀";
  return `<li class="cmsg${x.mine?" mine":""}" style="--cc:${col}"><span class="cchip">${han}</span><span class="cbody"><b>${esc(x.name)}</b>${x.e?`<span class="cemo">${x.e.em}</span> <i>${esc(x.e.cap)}</i>`:esc(x.text)}</span></li>`;
}
function renderChatLists(){
  const html=CHAT.log.length?CHAT.log.slice(-40).map(chatItemHTML).join(""):`<li class="cempty">${NET.code?"Chưa có tin nhắn. Gửi lời chào hay thả một biểu cảm nhé.":"Thả biểu cảm cho giới đang tới lượt."}</li>`;
  document.querySelectorAll(".chat-list").forEach(l=>{const atEnd=l.scrollHeight-l.scrollTop-l.clientHeight<30;l.innerHTML=html;if(atEnd||l.dataset.init!=="1"){l.scrollTop=l.scrollHeight;l.dataset.init="1"}});
}
function emoPickerHTML(){
  const f=myFac();
  const btn=(g,i,[em,cap])=>`<button class="emo" data-emo="${g}:${i}" title="${esc(cap)}" aria-label="${esc(cap)}" style="--cc:${g==="c"?"#9a8fa6":FAC[g].hex}"><span>${em}</span><small>${esc(cap)}</small></button>`;
  const own=f>=0?`<div class="emo-head" style="--cc:${FAC[f].hex}"><span>${FAC[f].han}</span>${FAC[f].world}</div><div class="emo-grid">${EMO[f].map((x,i)=>btn(f,i,x)).join("")}</div>`:`<p class="note">Ngồi vào một giới để có bộ biểu cảm riêng của giới đó.</p>`;
  return own+`<div class="emo-head"><span>共</span>Chung</div><div class="emo-grid">${EMO.c.map((x,i)=>btn("c",i,x)).join("")}</div>`;
}
function chatBoxHTML(where){
  const online=!!NET.code;
  return `<ol class="chat-list" aria-live="polite"></ol>
    <details class="emo-wrap" ${where==="sheet"||!online?"open":""}><summary>${online?"Thả biểu cảm":"Chọn biểu cảm"}</summary><div class="emo-pick">${emoPickerHTML()}</div></details>
    ${online?`<form class="chat-form" data-chat="${where}"><input id="chatIn-${where}" maxlength="120" autocomplete="off" placeholder="Nhắn cho cả phòng…" aria-label="Tin nhắn"><button class="btn primary" type="submit">Gửi</button></form>`:""}`;
}
let chatKey="";
function renderChatPanel(){
  const p=$("#chatPanel");if(!p)return;
  const show=!!(G||NET.code);p.hidden=!show;if(!show)return;
  const key=(NET.code?"o":"l")+"|"+myFac();
  if(key!==chatKey||!p.querySelector(".chat-list")){const v=$("#chatIn-side")?$("#chatIn-side").value:"";const open=p.querySelector(".emo-wrap")?p.querySelector(".emo-wrap").open:true;
    p.innerHTML=`<h3>${NET.code?"Trò chuyện":"Biểu cảm"}</h3>${chatBoxHTML("side")}`;chatKey=key;
    const w=p.querySelector(".emo-wrap");if(w)w.open=open;if($("#chatIn-side"))$("#chatIn-side").value=v;renderChatLists()}
  renderChatFab();
}
function renderChatFab(){
  const b=$("#chatFab");if(!b)return;b.hidden=!(G||NET.code);
  b.innerHTML=`<span aria-hidden="true">${NET.code?"💬":"😀"}</span>${CHAT.unread?`<b class="fab-badge">${CHAT.unread>9?"9+":CHAT.unread}</b>`:""}`;
  b.setAttribute("aria-label",NET.code?"Trò chuyện"+(CHAT.unread?`, ${CHAT.unread} tin mới`:""):"Thả biểu cảm");
}
function openChatSheet(){CHAT.unread=0;renderChatFab();openSheet(`<div id="chatSheet"><h2>${NET.code?"Trò chuyện":"Biểu cảm"}</h2>${chatBoxHTML("sheet")}</div><div class="opts foot"><button class="btn" data-act="close">Đóng</button></div>`);renderChatLists()}
/* biểu cảm bay lên ở góc chuồng của phe gửi */
function stickerShow(fac,name,e,text){
  const wrap=$(".board-wrap");if(!wrap)return;
  const pos=["tl","tr","br","bl"][fac]||"tc";
  const old=wrap.querySelector(".stk.p-"+pos);if(old)old.remove();
  const d=document.createElement("div");d.className="stk p-"+pos+(e?" is-emo":" is-msg");d.style.setProperty("--cc",FAC_COL(fac));
  d.innerHTML=e?`<span class="stk-em">${e.em}</span><span class="stk-cap"><b>${esc(name)}</b>${esc(e.cap)}</span>`:`<span class="stk-cap"><b>${esc(name)}</b>${esc(text.length>70?text.slice(0,68)+"…":text)}</span>`;
  wrap.appendChild(d);setTimeout(()=>{d.classList.add("out");setTimeout(()=>d.remove(),400)},e?2600:4200);
}
SND.emote=f=>{const n=[[2,4,3],[5,7,9],[4,6,8],[8,10,12]][f]||[6,8,10];n.forEach((k,i)=>pluck(k,{vol:.16,at:i*.06}));tone(f===1?988:f===3?1568:f===0?330:740,.18,{type:"triangle",vol:.05,at:.12})};
SND.msg=()=>{tone(1320,.07,{type:"triangle",vol:.05});tone(1760,.09,{type:"triangle",vol:.04,at:.06})};
document.addEventListener("submit",e=>{const f=e.target.closest(".chat-form");if(!f)return;e.preventDefault();const i=f.querySelector("input");if(sendChat(i.value)){i.value="";i.focus()}});

/* ---------- Khởi động ---------- */
$("#board").innerHTML=boardSVG();
$("#legend").innerHTML=KNINFO.map((k,i)=>`<span><i style="color:${FAC[i].hex}">${FAC[i].han}</i>${k.n}</span>`).join("")+`<span><i style="color:var(--gold2)">經</i>Tây Thiên</span><button class="btn viewbtn" id="viewBtn" data-act="view" hidden>Chuyển sang 2D</button><button class="btn viewbtn" id="camBtn" data-act="cam" aria-pressed="true"></button>`;


/* ---------- Phiên bản: mọi máy trong phòng phải chạy cùng một bản game ---------- */
const APP_VER="ctk-202611050402";
const verNum=v=>+(String(v||"").replace(/\D/g,"")||0);
function reloadApp(){const go=()=>location.reload();if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(r=>r?r.update().catch(()=>{}):0).finally(()=>setTimeout(go,400));else go()}
function showUpdate(msg,canReload){
  let b=$("#updBar");if(!b){b=document.createElement("div");b.id="updBar";b.className="updbar";b.setAttribute("role","status");document.body.appendChild(b)}
  b.innerHTML=`<span>${msg}</span>${canReload?`<button class="btn primary" data-act="reloadApp">Tải lại</button>`:""}<button class="btn" data-act="updClose" aria-label="Đóng">✕</button>`;b.hidden=false;
}
function verCheckRoom(m){
  if(APP_VER==="dev"||!m||!m.ver||m.ver===APP_VER)return;
  if(verNum(m.ver)>verNum(APP_VER))showUpdate("Phòng này dùng bản game mới hơn máy bạn (có bản Nâng cấp). Bấm Tải lại để cập nhật, game tự vào lại phòng.",true);
  else if(NET.mode!=="host")showUpdate("Chủ phòng đang dùng bản game cũ hơn máy bạn. Nhờ chủ phòng đóng hẳn app hoặc tải lại trang để cập nhật.",false);
}
/* có bản mới trên máy chủ: chưa vào ván thì tự tải lại, đang chơi thì hiện nút để người chơi tự chọn lúc */
if(navigator.serviceWorker&&APP_VER!=="dev"){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;
    if(!G&&!NET.code){reloading=true;location.reload()}else showUpdate("Đã có bản game mới. Tải lại khi tiện để cập nhật.",true)});
  const chk=()=>navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()});
  setInterval(chk,30*60*1000);
}
/* ---------- Tiết kiệm pin ----------
   Mặc định bật trên điện thoại/máy tính bảng, và trên laptop khi đang chạy pin dưới 30%.
   Khi bật: giữ đủ hiệu ứng nhưng 3D vẽ tối đa 30 hình/giây (cảnh nền 20), độ phân giải và bóng đổ nhẹ hơn.
   Người chơi bấm nút thì nhớ lựa chọn đó. */
const ECO={on:false,user:null};
/* để máy không ai chạm và ván không đổi suốt 2 phút (bỏ quên trên bàn) thì cảnh trang trí đứng yên; chạm lại là chạy tiếp */
var IDLE={t:performance.now(),on:false};
function poke(){if(!IDLE)return;IDLE.t=performance.now();if(IDLE.on){IDLE.on=false;document.body.classList.remove("calm");V3.dirty=true}}
["pointerdown","pointermove","keydown","wheel","touchstart"].forEach(e=>addEventListener(e,poke,{passive:true}));
setInterval(()=>{if(!IDLE.on&&performance.now()-IDLE.t>120000){IDLE.on=true;document.body.classList.add("calm")}},1000);
const ecoHTML=()=>`<span class="ic" aria-hidden="true">省</span>Tiết kiệm pin: ${ECO.on?"Bật":"Tắt"}`;
function setEco(on,user){
  ECO.on=!!on;
  if(user){ECO.user=ECO.on?"on":"off";try{localStorage.setItem(SAVE_KEY+"-eco",ECO.user)}catch(e){}toast(ECO.on?"Đã bật tiết kiệm pin: vẫn đủ hiệu ứng, 3D vẽ nhẹ hơn.":"Đã tắt tiết kiệm pin: 3D nét nhất.")}
  document.body.classList.toggle("eco",ECO.on);
  document.querySelectorAll('[data-act="eco"]').forEach(b=>{b.innerHTML=ecoHTML();b.setAttribute("aria-pressed",ECO.on?"true":"false")});
  V3quality();
}
function V3quality(){
  if(!V3.r)return;const r=V3.r,eco=ECO.on,dpr=window.devicePixelRatio||1;
  r.setPixelRatio(Math.min(dpr,eco?1.5:2));
  if(V3.wrap&&V3.wrap.clientWidth)r.setSize(V3.wrap.clientWidth,V3.wrap.clientHeight,false);
  const type=eco?THREE.PCFShadowMap:THREE.PCFSoftShadowMap,sz=eco?1024:2048;
  if(r.shadowMap.type!==type)r.shadowMap.type=type;
  if(V3.sun&&V3.sun.shadow.mapSize.x!==sz){V3.sun.shadow.mapSize.set(sz,sz);if(V3.sun.shadow.map){V3.sun.shadow.map.dispose();V3.sun.shadow.map=null}}
  V3.dirty=true;
}
(function ecoInit(){
  try{ECO.user=localStorage.getItem(SAVE_KEY+"-eco")}catch(e){}
  const coarse=matchMedia("(pointer:coarse)").matches;
  setEco(ECO.user?ECO.user==="on":coarse,false);
  if(!ECO.user&&!coarse&&navigator.getBattery)navigator.getBattery().then(bt=>{
    const chk=()=>{if(!ECO.user)setEco(!bt.charging&&bt.level<=.3,false)};chk();
    bt.addEventListener("levelchange",chk);bt.addEventListener("chargingchange",chk)}).catch(()=>{});
})();
V3.ok=init3D();
let pref3d="3d";try{pref3d=localStorage.getItem(SAVE_KEY+"-view")||"3d"}catch(e){}
setView(V3.ok&&pref3d!=="2d");
requestAnimationFrame(loop3D);
soundLabel();camLabel();installBtnInit();
render();
{let saved=null;try{saved=KV().getItem("ctk-room")}catch(e){}
 const want=(qs.get("room")||"").toUpperCase();
 if(netReady()&&saved&&myName()&&(!want||want===saved))netJoin(saved,myName()).then(netAfterJoin).catch(()=>{try{KV().removeItem("ctk-room")}catch(e){}openSetup(want?"online":"local")});
 else if(want&&netReady())openSetup("online");
 else openSetup();}
</script>
