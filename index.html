<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cờ cá ngựa Tây Du Ký: bốn giới Ma, Phật, Nhân, Thiên tranh đường về Tây Thiên.">
<meta name="theme-color" content="#15101b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thỉnh Kinh">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cờ Thỉnh Kinh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Yeseva+One&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&text=%E5%A4%A9%E4%BD%9B%E4%BA%BA%E9%AD%94%E7%B6%93%E5%BE%8B%E7%89%8C%E7%AC%A6%E6%A3%8B%E9%9F%B3%E6%A8%82%E6%96%B0%E9%8F%A1&display=swap">
<style>
/* Layout: lacquer table — square board on the left, a scroll-like side panel on the right; stacks on phones. Single dark "sơn mài" look. */
:root{
  color-scheme:dark;
  --lac:#15101b; --lac2:#1f1828; --lac3:#2a2134; --line:#3a2f47;
  --gold:#d6ab52; --gold2:#f3d791;
  --silk:#efe2c4; --silk-line:#b99c62;
  --text:#f1e9da; --muted:#ab9fb3;
  --ma:#d1432f; --phat:#e3a514; --nhan:#3f9d5b; --thien:#3a7bd0;
  --f-disp:"Yeseva One","Noto Serif TC",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
}
body{
  background:var(--lac); color:var(--text); font-family:var(--f-body); font-size:14px; line-height:1.5;
  background-image:
    radial-gradient(ellipse 70% 50% at 15% -10%, rgba(214,171,82,.16), transparent 60%),
    radial-gradient(ellipse 60% 50% at 105% 105%, rgba(58,123,208,.12), transparent 60%),
    radial-gradient(ellipse 90% 60% at 50% 120%, rgba(209,67,47,.10), transparent 65%),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27140%27%20viewBox%3D%270%200%20180%20140%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23d6ab52%27%20stroke-opacity%3D%27.075%27%20stroke-width%3D%271.5%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M18%2052c-2-10%2010-15%2017-8%202-13%2019-14%2021-2%209-3%2015%207%208%2013z%27/%3E%3Cpath%20d%3D%27M35%2044c1%205%206%206%208%202%27/%3E%3Cpath%20d%3D%27M24%2054c0-5%205-6%207-3%27/%3E%3Cpath%20d%3D%27M104%20118c-2-10%2010-15%2017-8%202-13%2019-14%2021-2%209-3%2015%207%208%2013z%27/%3E%3Cpath%20d%3D%27M121%20110c1%205%206%206%208%202%27/%3E%3Cpath%20d%3D%27M110%20120c0-5%205-6%207-3%27/%3E%3C/g%3E%3Cg%20fill%3D%27%23d6ab52%27%20fill-opacity%3D%27.05%27%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2730%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%27100%27%20r%3D%271.6%27/%3E%3C/g%3E%3C/svg%3E");
  background-attachment:fixed;
  min-height:100%;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{
  max-width:1220px; margin:0 auto;
  padding-block:18px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; grid-template-columns:minmax(0,1fr); gap:18px;
}
@media (min-width:980px){ .app{grid-template-columns:minmax(0,1fr) 370px; align-items:start} .top{grid-column:1/-1} .side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px)} }

.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px; padding-bottom:18px; position:relative}
.top::after{content:""; position:absolute; left:0; right:0; bottom:0; height:8px; background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2716%27%20height%3D%278%27%20viewBox%3D%270%200%2016%208%27%3E%3Cpath%20d%3D%27M1%207V1h12v5H7V3.5%27%20fill%3D%27none%27%20stroke%3D%27%23d6ab52%27%20stroke-width%3D%271.2%27%20stroke-opacity%3D%27.75%27/%3E%3C/svg%3E") repeat-x left center/16px 8px; border-top:1px solid rgba(214,171,82,.35); border-bottom:1px solid rgba(214,171,82,.35)}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.seal{width:52px; height:52px; flex:none; border-radius:9px; background:radial-gradient(circle at 35% 30%,#e8583c,#a82a1c); display:grid; place-items:center; font-family:var(--f-han); font-size:31px; color:#fff3dc; box-shadow:inset 0 0 0 2px rgba(255,240,210,.4),inset 0 0 0 5px #b83224,inset 0 0 0 6px rgba(255,240,210,.3),0 4px 14px rgba(209,67,47,.35); transform:rotate(-4deg)}
h1{font-family:var(--f-disp); font-weight:400; font-size:clamp(28px,4.4vw,40px); line-height:1.05; margin:0; letter-spacing:.015em; color:var(--gold2); text-wrap:balance; background:linear-gradient(180deg,#fff0c0 10%,#e3b65a 55%,#b0782a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.tag{margin:5px 0 0; color:#c9b8a0; font-size:12px; letter-spacing:.14em; text-transform:uppercase}
.top-actions{display:flex; flex-wrap:wrap; gap:8px}
.btn{border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line)); background:linear-gradient(180deg,#2c2236,#1d1626); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:500; font-size:13px; transition:background .15s, border-color .15s, box-shadow .2s, transform .15s; box-shadow:inset 0 1px 0 rgba(255,240,210,.07)}
.btn .ic{font-family:var(--f-han); font-size:14px; color:var(--gold); margin-right:6px; display:inline-block; transform:translateY(1px)}
.btn.primary .ic{color:#5a1a10}
.btn:active{transform:translateY(1px)}
.btn:hover{border-color:var(--gold); background:linear-gradient(180deg,#372a43,#241b2e); box-shadow:inset 0 1px 0 rgba(255,240,210,.1),0 0 14px rgba(214,171,82,.18)}
.btn:focus-visible,.pc:focus-visible,.opt:focus-visible{outline:2px solid var(--gold2); outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#f3d791,#d6a64a 60%,#b9862e); color:#2a1608; border-color:#f3d791; font-weight:700; box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 12px rgba(214,171,82,.3)}
.btn.primary:hover{background:linear-gradient(180deg,#fff0c0,#e3b65a 60%,#c4923a); box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 20px rgba(243,215,145,.45)}
.btn[disabled]{opacity:.45; cursor:not-allowed}

.stage{min-width:0}
.board-wrap{width:100%; max-width:min(760px, calc(100vh - 120px)); min-width:min(100%, 320px); margin-inline:auto; aspect-ratio:1}
.board-wrap{position:relative}
#board{width:100%; height:100%; display:block; user-select:none; -webkit-user-select:none}
#b3d{position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:10px; touch-action:none; cursor:grab}
.tip{position:absolute; transform:translate(-50%,calc(-100% - 14px)); pointer-events:none; background:var(--lac3); border:1px solid var(--gold); color:var(--text); font-size:12px; padding:4px 9px; border-radius:7px; white-space:nowrap}
.viewbtn{margin-left:4px}
.galview{position:relative; width:100%; aspect-ratio:4/3; max-height:52vh; border-radius:12px; overflow:hidden; background:var(--lac3); margin:6px 0 4px}
#galcv{width:100%; height:100%; display:block; touch-action:none}
.galcap{position:absolute; left:12px; bottom:10px; right:12px; font-size:13px; text-shadow:0 1px 3px #000}
.galcap span{color:var(--muted)}
.galchips{display:flex; flex-wrap:wrap; gap:6px}
.galbtn{padding:6px 11px; font-size:12.5px; font-weight:500}
.galbtn.on{border-color:var(--cc); background:color-mix(in srgb, var(--cc) 30%, var(--lac3))}
.legend{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; margin-top:12px; color:var(--muted); font-size:12.5px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{font-style:normal; font-family:var(--f-han); width:20px; height:20px; display:grid; place-items:center; border-radius:4px; background:var(--lac3); font-size:13px}

/* board svg */
.frame{fill:#1f1828; stroke:#e3b65a; stroke-width:.5}
.knglow,.kglow,.halo,.flame,.talis{transform-box:fill-box}
.knglow{transform-origin:center; animation:knPulse 2.8s ease-in-out infinite}
.kglow{transform-origin:center; animation:knPulse 3.6s ease-in-out infinite}
@keyframes knPulse{50%{opacity:.5; transform:scale(.82)}}
.rays{transform-box:fill-box; transform-origin:center; animation:spin 48s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flame{transform-origin:50% 100%; animation:flick 1.2s ease-in-out infinite alternate}
.flame:nth-of-type(2n){animation-duration:.9s; animation-delay:-.4s}
@keyframes flick{to{transform:scaleY(1.2) skewX(5deg)}}
.halo{transform-origin:center; animation:knPulse 4.5s ease-in-out infinite}
.talis{transform-origin:50% 0; animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.wave{animation:waveMove 3.6s ease-in-out infinite alternate}
@keyframes waveMove{to{transform:translateX(-4px)}}
.cloud{animation:cloudMove 9s ease-in-out infinite alternate}
.cloud:nth-of-type(2n){animation-duration:12s; animation-direction:alternate-reverse}
@keyframes cloudMove{to{transform:translateX(3.5px)}}
.pv{fill:none; stroke:#f3d791; stroke-width:.7; stroke-dasharray:1.4 .9; animation:pvDash 1s linear infinite}
.pv-fill{fill:#f3d791; opacity:.22}
@keyframes pvDash{to{stroke-dashoffset:-4.6}}
.cell{stroke:var(--silk-line); stroke-width:.35}
.kn{stroke-width:.9}
.kn.flash{animation:knflash .9s ease 2}
@keyframes knflash{50%{filter:brightness(2.2)}}
.han{font-family:var(--f-han); font-weight:700; text-anchor:middle; dominant-baseline:central}
.blabel{font-family:var(--f-body); font-size:3.3px; font-weight:700; letter-spacing:.06em; text-anchor:middle; fill:#fff7e6; paint-order:stroke; stroke:rgba(0,0,0,.55); stroke-width:.7px}
.bring{fill:none; stroke-width:.8; opacity:.4}
.bring.on{opacity:1; stroke-width:1.4; animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{stroke-opacity:.35}}
.tok{transition:transform .16s ease; outline:none}
.tok-body{stroke:none}
.tok-rim{fill:none; stroke:#fff4d8; stroke-width:.55}
.tok-t{font-family:var(--f-body); font-size:2.7px; font-weight:700; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.tok-ring{fill:none; stroke:transparent; stroke-width:.8}
.tok-shield{fill:none; stroke:transparent; stroke-width:.7; stroke-dasharray:1.2 .8}
.tok.sh .tok-shield{stroke:var(--gold2)}
.tok.can{cursor:pointer}
.tok.can .tok-ring{stroke:var(--gold2); animation:ring 1s ease-in-out infinite}
.tok.done .tok-rim{stroke:var(--gold2)}
@keyframes ring{50%{stroke-opacity:.2}}

/* side */
.side{display:flex; flex-direction:column; gap:14px; min-width:0}
.panel{background:linear-gradient(170deg,#241b2e,#1b1424 70%); border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line)); border-radius:12px; padding:16px; position:relative; box-shadow:0 8px 24px rgba(0,0,0,.25)}
.panel::before{content:""; position:absolute; inset:5px; border:1px solid rgba(214,171,82,.13); border-radius:8px; pointer-events:none}
.panel h3{margin:0 0 10px; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#cdb98f; font-weight:600; display:flex; align-items:center; gap:8px}
.panel h3::before{content:""; width:7px; height:7px; flex:none; transform:rotate(45deg); background:var(--gold); box-shadow:0 0 8px rgba(214,171,82,.6)}
.panel h3::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,rgba(214,171,82,.35),transparent)}
.turn{border-radius:12px; overflow:hidden; border:1px solid color-mix(in srgb, var(--fc) 60%, var(--line)); background:linear-gradient(170deg,#241b2e,#1b1424 70%); box-shadow:0 8px 28px rgba(0,0,0,.3),0 0 34px color-mix(in srgb,var(--fc) 18%,transparent)}
.turn-head{display:flex; align-items:center; gap:12px; padding:12px 14px; background:linear-gradient(100deg, color-mix(in srgb, var(--fc) 38%, var(--lac2)), var(--lac2) 85%)}
.turn-head .hg{font-family:var(--f-han); font-size:30px; line-height:1; width:48px; height:48px; display:grid; place-items:center; border-radius:9px; background:var(--fc); color:#fff8e8; flex:none; box-shadow:inset 0 0 0 2px rgba(255,240,210,.4),inset 0 0 0 4px var(--fc),inset 0 0 0 5px rgba(255,240,210,.25),0 0 18px color-mix(in srgb,var(--fc) 50%,transparent)}
.turn-name{font-family:var(--f-disp); font-size:20px; line-height:1.15}
.turn-sub{color:var(--muted); font-size:12.5px}
.turn-body{display:flex; gap:14px; align-items:center; padding:14px}
.die{width:64px; height:64px; flex:none}
.die rect{fill:var(--silk); stroke:var(--gold); stroke-width:1.5}
.die circle{fill:#2a1d12}
.die .die-n,.die .die-q{font-family:var(--f-disp); font-size:20px; text-anchor:middle; dominant-baseline:central; fill:#2a1d12}
.die.big{width:72px; height:72px}
.status{font-size:13.5px; margin:0 0 10px}
.acts{display:flex; flex-wrap:wrap; gap:8px}
.hand-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px}
.pc{--cc:var(--gold); position:relative; overflow:hidden; text-align:left; display:flex; flex-direction:column; gap:4px; padding:10px 11px 11px; border-radius:10px; cursor:pointer; border:1px solid color-mix(in srgb, var(--cc) 60%, transparent); background:linear-gradient(170deg, color-mix(in srgb, var(--cc) 26%, var(--lac2)), var(--lac2) 70%); min-width:0; transition:transform .15s, box-shadow .15s}
.pc:hover:not([disabled]){transform:translateY(-3px) rotate(-.5deg)}
.pc[disabled]{opacity:.5; cursor:default}
.pc::after{content:attr(data-han); position:absolute; right:-2px; bottom:-16px; font-family:var(--f-han); font-size:70px; line-height:1; color:var(--cc); opacity:.13; pointer-events:none}
.pc::before{content:""; position:absolute; inset:4px; border:1px solid color-mix(in srgb,var(--cc) 30%,transparent); border-radius:7px; pointer-events:none}
.pc:hover:not([disabled]){border-color:var(--cc); box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 18px color-mix(in srgb,var(--cc) 35%,transparent)}
.pc .kind{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:color-mix(in srgb, var(--cc) 70%, white)}
.pc .nm{font-family:var(--f-disp); font-size:15.5px; line-height:1.2}
.pc .tx{font-size:12px; color:var(--muted); line-height:1.4}
.pc .when{margin-top:auto; padding-top:4px; font-size:11px; color:var(--text); opacity:.75}
.note{color:var(--muted); font-size:12.5px; margin:8px 0 0}
.empty{color:var(--muted); font-size:13px; margin:0}
.pl{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:8px 6px; border-radius:8px}
.pl+.pl{border-top:1px solid var(--line)}
.pl.cur{background:var(--lac3)}
.pl .chip{width:30px; height:30px; border-radius:6px; display:grid; place-items:center; font-family:var(--f-han); font-size:17px; color:#fff8e8}
.pl .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pl .meta{grid-column:2/4; display:flex; flex-wrap:wrap; gap:4px 10px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.dots{display:flex; gap:4px; align-items:center}
.dot{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--fc); background:transparent}
.dot.out{background:color-mix(in srgb, var(--fc) 45%, transparent)}
.dot.home{background:var(--fc)}
.dot.done{background:var(--gold2); border-color:var(--gold2)}
.badge{font-size:10.5px; padding:1px 7px; border-radius:99px; background:var(--lac3); border:1px solid var(--line); color:var(--text)}
#log{list-style:none; margin:0; padding:0; max-height:240px; overflow:auto; display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:#d9cfdc}
#log li{padding-left:10px; border-left:2px solid var(--line)}
#log li:first-child{border-left-color:var(--gold); color:var(--text)}
.lc{font-weight:600; color:var(--cc)}

/* modal */
.modal{position:fixed; inset:0; z-index:50; background:rgba(8,5,12,.72); display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); backdrop-filter:blur(3px)}
.sheet{width:min(700px,100%); max-height:100%; overflow:auto; border:1px solid var(--gold); border-radius:14px; padding:30px 26px 24px;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2716%27%20height%3D%278%27%20viewBox%3D%270%200%2016%208%27%3E%3Cpath%20d%3D%27M1%207V1h12v5H7V3.5%27%20fill%3D%27none%27%20stroke%3D%27%23d6ab52%27%20stroke-width%3D%271.2%27%20stroke-opacity%3D%27.75%27/%3E%3C/svg%3E") repeat-x left 9px top 9px/16px 8px, url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2716%27%20height%3D%278%27%20viewBox%3D%270%200%2016%208%27%3E%3Cpath%20d%3D%27M1%207V1h12v5H7V3.5%27%20fill%3D%27none%27%20stroke%3D%27%23d6ab52%27%20stroke-width%3D%271.2%27%20stroke-opacity%3D%27.75%27/%3E%3C/svg%3E") repeat-x left 9px bottom 9px/16px 8px, radial-gradient(ellipse 80% 50% at 50% 0%,rgba(214,171,82,.12),transparent 70%), linear-gradient(175deg,#251c30,#18111f);
  box-shadow:inset 0 0 0 6px #1f1828,inset 0 0 0 7px rgba(214,171,82,.3),0 24px 70px rgba(0,0,0,.6),0 0 60px rgba(214,171,82,.12); animation:sheetIn .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes sheetIn{from{opacity:0; transform:translateY(14px) scale(.97)}}
.modal{overflow-y:auto}
.sheet{max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); overscroll-behavior:contain}
/* hàng nút chính luôn nằm ở đáy hộp thoại, không bị đẩy khỏi màn hình */
.sheet .opts.foot{position:sticky; bottom:-24px; z-index:2; margin:16px -26px -24px; padding:12px 26px 16px; background:linear-gradient(180deg,rgba(24,17,31,.88),#18111f 45%); border-top:1px solid rgba(214,171,82,.28); border-radius:0 0 13px 13px}
@media (max-height:780px){ .sheet .menu-hero{margin-top:-14px; padding-bottom:8px} .sheet .mh-seals{display:none} .sheet h2.mh-title{font-size:30px} .sheet .seat{padding:7px 10px; margin-bottom:6px} .sheet .seat small{display:none} }
@media (max-width:520px){ .modal .sheet{padding:22px 16px 24px} .sheet .opts.foot{margin:14px -16px -24px; padding:12px 16px 16px} .sheet .seat small{display:none} }
.sheet h2::after{content:""; display:block; width:84px; height:2px; margin-top:9px; background:linear-gradient(90deg,var(--gold),transparent)}
.sheet h2{font-family:var(--f-disp); font-weight:400; font-size:24px; margin:0 0 6px; color:var(--gold2); text-wrap:balance}
.sheet h4{margin:18px 0 8px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.sheet p{margin:0 0 10px; max-width:65ch}
.sheet ul{margin:0 0 10px; padding-left:18px; max-width:68ch}
.sheet li{margin-bottom:5px}
.opts{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}

@keyframes banOut{to{opacity:0;transform:translate(-50%,-62%) scale(.96)}}

.pl.burn{background:color-mix(in srgb,#d1432f 26%,transparent);box-shadow:inset 3px 0 0 #d1432f}
.pl.hex{background:color-mix(in srgb,#9a5ad0 26%,transparent);box-shadow:inset 3px 0 0 #9a5ad0}

}

    bot(pi){let b=null;for(let d=1;d<=6;d++){const s=evalBest(pi,d);if(!b||s>b.s)b={s,d}}return {args:{v:b.d},val:8+b.s*.2}}},
  N4:{f:2,n:"Lật Mặt",w:"post",q:2,t:"Lật mặt xúc xắc: số bước thành 7 trừ số vừa đổ.",
    can(){return G.dice!=null&&G.dice<=6},
    async ask(){return {}},
    async run(){G.dice=7-G.dice;log(`Xúc xắc lật thành <b>${G.dice}</b>.`);recalc()},
    bot(pi){return {args:{},val:evalBest(pi,7-G.dice)-evalBest(pi,G.dice)}}},
  N5:{f:2,n:"Tai Ương",w:"any",q:2,t:"Lần đổ kế tiếp của một đối thủ bị chia đôi (làm tròn lên).",
    can(pi){return opps(pi).length>0},
    async ask(pi){const v=await choosePlayer(pi,"Giáng tai ương lên ai?",opps(pi));return v!=null&&{t:v}},
    async run(pi,a){P(a.t).halve=true;log(`${nm(a.t)} gặp tai ương, lần đổ tới bị chia đôi.`)},
    bot(pi){const t=leader(pi);return t==null?null:{args:{t},val:10}}},
};

/* ---------- Trạng thái ---------- */
let G=null, tokEls=[];
const P=i=>G.players[i];
const tok=o=>P(o.pi).tokens[o.ti];
const mainIdx=o=>(START[P(o.pi).fac]+tok(o).p)%56;
function nm(pi){const pl=P(pi);return `<b style="color:${FAC[pl.fac].hex}">${esc(pl.name)}</b>`}
function tl(o){const f=P(o.pi).fac;return `<b style="color:${FAC[f].hex}">${CHARS[f][o.ti].n}</b>`}
function allTokens(){const a=[];G.players.forEach((pl,pi)=>pl.tokens.forEach((t,ti)=>a.push({pi,ti})));return a}
function occupants(idx){return allTokens().filter(o=>{const t=tok(o);return t.p>=0&&t.p<=54&&mainIdx(o)===idx})}
function ownOnBoard(pi){return P(pi).tokens.map((t,ti)=>({pi,ti})).filter(o=>tok(o).p>=0&&tok(o).p<61)}
function ownMain(pi){return P(pi).tokens.map((t,ti)=>({pi,ti})).filter(o=>tok(o).p>=0&&tok(o).p<=54&&!0)}
function enemyMain(pi){return allTokens().filter(o=>o.pi!==pi&&tok(o).p>=0&&tok(o).p<=54&&!tok(o).sh)}
function opps(pi){return G.players.map((_,i)=>i).filter(i=>i!==pi)}
function finished(pi){return P(pi).tokens.filter(t=>t.p===61).length}
function progress(pi){return P(pi).tokens.reduce((s,t)=>s+Math.max(t.p,0),0)+finished(pi)*60}
function leader(pi){return opps(pi).sort((a,b)=>progress(b)-progress(a))[0]}
function topEnemy(pi){return enemyMain(pi).sort((a,b)=>tok(b).p-tok(a).p)[0]}
function sendHome(o){const t=tok(o);t.p=-1;t.sh=false;markFly(o)}
function canExitTo(pi){const occ=occupants(START[P(pi).fac]);return !occ.some(o=>o.pi===pi)&&!occ.some(o=>tok(o).sh)}
function swapOK(a,b){const na=(mainIdx(b)-START[P(a.pi).fac]+56)%56,nb=(mainIdx(a)-START[P(b.pi).fac]+56)%56;return na<=54&&nb<=54}
function knAhead(o){const t=tok(o),f=P(o.pi).fac;for(let s=1;t.p+s<=54;s++){const idx=(START[f]+t.p+s)%56;if(KNIDX[idx]!==undefined){const occ=occupants(idx);if(occ.some(x=>x.pi===o.pi||tok(x).sh))return null;return t.p+s}}return null}
function pushBack(o,n){const t=tok(o),f=P(o.pi).fac;let np=t.p-n;while(np>=0&&occupants((START[f]+np)%56).length)np--;t.p=np<0?-1:np}
function danger(pi,idx){let d=0;for(const o of allTokens()){if(o.pi===pi)continue;const t=tok(o);if(t.p<0||t.p>54)continue;const dist=(idx-mainIdx(o)+56)%56;if(dist>=1&&dist<=6&&t.p+dist<=54)d++}return d}

function legalMoves(pi,d){
  const pl=P(pi),out=[];let exitAdded=false;
  pl.tokens.forEach((t,ti)=>{
    if(t.p===61)return;
    if(t.p<0){ if(EXIT_ROLLS.includes(d)&&!exitAdded&&canExitTo(pi)){out.push({ti,exit:true,to:0});exitAdded=true} return }
    const to=t.p+d; if(to>61)return;
    if(blockedBetween(pi,t.p,to))return;
    if(to<=54){const occ=occupants((START[pl.fac]+to)%56);if(occ.some(o=>o.pi===pi)||occ.some(o=>tok(o).sh))return}
    else if(to<61&&pl.tokens.some(x=>x.p===to))return;
    out.push({ti,to});
  });
  return out;
}
const EXIT_ROLLS=[1,6];
const isBonus=d=>d===1||d===6;
/* Không được vượt qua bất kỳ quân nào nằm giữa đường đi (ô đích được phép có quân địch để đá). */
function blockedBetween(pi,from,to){
  const pl=P(pi);
  for(let p=from+1;p<to;p++){
    if(p<=54){if(occupants((START[pl.fac]+p)%56).length)return true}
    else if(p<61&&pl.tokens.some(x=>x.p===p))return true;
  }
  return false;
}
function scoreMove(pi,m){
  const f=P(pi).fac;let s=0;
  if(m.exit)s+=35;
  if(m.to===61)s+=55;else if(m.to>54)s+=22;
  if(m.to<=54){const idx=(START[f]+m.to)%56;const occ=occupants(idx).filter(o=>o.pi!==pi);if(occ.length)s+=50+tok(occ[0]).p*.4;const k=KNIDX[idx];if(k!==undefined)s+=[12,20,14,25][k];s-=danger(pi,idx)*10}
  if(!m.exit){const from=P(pi).tokens[m.ti].p;s+=(m.to-from)*.4+from*.05;if(from<=54)s+=danger(pi,(START[f]+from)%56)*7}
  return s+Math.random()*2;
}
function evalBest(pi,d){const ms=legalMoves(pi,d);return ms.length?Math.max(...ms.map(m=>scoreMove(pi,m))):-20}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(){const d=[];for(const[id,c]of Object.entries(CARDS))for(let i=0;i<c.q;i++)d.push(id);return shuffle(d)}
function drawCard(pi,quiet){
  if(!G.deck.length){G.deck=shuffle(G.discard);G.discard=[]}
  if(!G.deck.length){if(!quiet)log("Bộ bài Phép đã cạn.");return}
  const id=G.deck.pop();
  if(P(pi).hand.length>=HAND_MAX){G.discard.push(id);if(!quiet)log(`${nm(pi)} rút 1 lá nhưng tay đã đủ ${HAND_MAX} lá, lá bị bỏ.`);return}
  P(pi).hand.push(id);if(!quiet){log(`${nm(pi)} rút 1 lá bài Phép.`);pulseHand(pi)}
}
function log(h){if(!G)return;G.log.unshift(h);if(G.log.length>80)G.log.pop();renderLog();netDirty()}

/* ---------- Diễn biến ---------- */
function newGame(seats,winTarget){
  if(typeof camReset==="function")camReset();
  const players=seats.map(s=>({fac:s.fac,name:s.name,type:s.type,uid:s.uid||null,tokens:Array.from({length:5},()=>({p:-1,sh:false})),hand:[],skip:0,halve:false}));
  G={players,cur:0,phase:"roll",dice:null,moves:[],cardUsed:false,deck:buildDeck(),discard:[],log:[],winTarget,sixes:0,winner:null,busy:false,select:null,turnId:0};
  players.forEach((_,i)=>{drawCard(i,true);drawCard(i,true)});
  buildTokens();
  log(`Ván mới bắt đầu. Nhà nào đưa đủ <b>${winTarget}</b> quân về ô Kinh trước sẽ thắng.`);
  startTurn();
}
function startTurn(){
  const pi=G.cur,pl=P(pi);
  G.turnId++;
  pl.tokens.forEach(t=>t.sh=false);
  if(pl.skip>0){pl.skip--;log(`${nm(pi)} đang bị mê hồn, mất lượt.`);FX.banner({han:"魔",kicker:"Mê hồn",title:`${pl.name} mất lượt`,color:"#8a4ab8"});sfx("dark");rowFx(pi,"hex");G.phase="skip";render();const id=G.turnId;setTimeout(()=>{if(G&&G.turnId===id)nextTurn()},1500);return}
  G.phase="roll";G.dice=null;G.moves=[];G.cardUsed=false;
  if(!NET.mode)save();render();
  if(pl.type==="bot")botTurn(G.turnId);else{turnChime(pi);camTurnView()}
}
function nextTurn(){if(G.winner!=null)return;G.cur=(G.cur+1)%G.players.length;G.sixes=0;startTurn()}
function finishTurn(extra){
  if(G.winner!=null)return endGame();
  if(extra&&G.sixes<2){G.sixes++;log(`${nm(G.cur)} đổ được ${G.dice}, đi thêm lượt.`);{const F=FAC[P(G.cur).fac];FX.banner({small:true,han:F.han,kicker:"Thêm lượt",title:`Đổ được ${G.dice}`,color:F.hex})}G.turnId++;G.phase="roll";G.dice=null;G.moves=[];G.cardUsed=false;render();if(P(G.cur).type==="bot")botTurn(G.turnId);else camTurnView();}
  else nextTurn();
}
function setRolled(v){
  const pl=P(G.cur);
  let cursed=false;
  if(pl.halve){const o=v;v=Math.ceil(v/2);pl.halve=false;cursed=true;log(`Tai ương: ${nm(G.cur)} đổ ${o} chỉ còn ${v}.`)}
  G.dice=v;G.phase="move";G.moves=legalMoves(G.cur,v);
  log(`${nm(G.cur)} đổ được <b>${v}</b>.`);render();
  if(cursed){dieFx("cursed");sfx("dark")}
  else if(isBonus(v)){dieFx("lucky");sfx("bonus")}
  camAfterRoll();
}
function recalc(){G.moves=legalMoves(G.cur,G.dice);render();camAfterRoll()}
async function animateRoll(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  netFx("roll",[]);
  const box=$("#die");
  if(box)box.className="rolling";sfx("roll");
  if(!reduce)for(let i=0;i<9;i++){if(box)box.innerHTML=dieSVG(1+Math.floor(Math.random()*6),"big");await sleep(55)}
  const v=1+Math.floor(Math.random()*6);
  if(box){box.className="pop";box.innerHTML=dieSVG(v,"big")}sfx("land");
  await sleep(220);return v;
}
async function humanRoll(remote){
  if(NET.mode==="client"){if(G&&G.phase==="roll"&&!G.busy&&!G.select&&localSeat(G.cur)){netIntent("roll");G.busy=true;renderTurn()}return}
  if(!G||G.busy||G.select||G.phase!=="roll"||!(remote===true||localSeat(G.cur)))return;
  G.busy=true;render();const v=await animateRoll();G.busy=false;setRolled(v);
}
async function moveCore(pi,m){
  const t=P(pi).tokens[m.ti],o={pi,ti:m.ti},F=FAC[P(pi).fac];
  CAM.follow(o);
  if(m.exit){t.p=0;place();const xy=tokXY(o);FX.at("pillar",xy,F.hex,{h:45});FX.at("burst",xy,F.hex);sfx("exit");await sleep(450)}
  else if(m.tele){FX.at("burst",tokXY(o),"#ff8a2a");sfx("whoosh");t.p=m.to;place();const xy=tokXY(o);FX.at("ring",xy,"#ff8a2a");FX.at("burst",xy,"#ffcf3a",{n:40});await sleep(480)}
  else for(let p=t.p+1;p<=m.to;p++){t.p=p;place();sfx("step");await sleep(115)}
  if(t.p<=54){
    const caps=occupants(mainIdx(o)).filter(x=>x.pi!==pi);
    if(caps.length){
      const xy=tokXY(o);CAM.focus(xy,{r:66,zoom:2.8,phi:1.08});
      FX.at("shock",xy,"#ff6a3a");FX.at("burst",xy,F.hex,{n:44});FX.shake();sfx("hit");
      FX.banner({han:F.han,kicker:"Đá quân",title:`${cname(o)} đá ${caps.map(cname).join(", ")}`,sub:"Quân bị đá bay về chuồng. Được rút 1 lá bài Phép.",color:F.hex});
      caps.forEach(c=>{log(`${tl(o)} đá ${tl(c)} về chuồng!`);sendHome(c)});place();drawCard(pi);await sleep(700);
    }
  }
  if(t.p===61){
    log(`${tl(o)} đã về tới Tây Thiên thỉnh kinh!`);
    CAM.focus([75,75],{r:78,zoom:2.5});
    FX.at("pillar",[75,75],"#f3d791",{h:75,life:1.7});FX.at("sparkle",[75,75],"#ffe08a");sfx("home");
    FX.banner({han:"經",kicker:"Về Tây Thiên",title:cname(o),sub:`${F.world} đã có ${finished(pi)}/${G.winTarget} quân về Kinh.`,color:"#c99a3a"});
    await sleep(750);
    if(finished(pi)>=G.winTarget)G.winner=pi;
  }
  if(t.p<=54&&G.winner==null){const k=KNIDX[mainIdx(o)];if(k!==undefined)await triggerKN(pi,o,k)}
  place();render();
  if(G.winner==null)CAM.release(800);
}
async function exitToken(pi){
  const ti=P(pi).tokens.findIndex(t=>t.p<0);
  if(ti<0||!canExitTo(pi))return false;
  await moveCore(pi,{ti,exit:true,to:0});return true;
}
async function triggerKN(pi,o,k){
  const idx=mainIdx(o),kx=cellXY(idx),K=FAC[k],el=document.getElementById("kn"+idx);
  knFlash(idx);
  log(`${tl(o)} gặp Kỳ Ngộ <b style="color:${K.hex}">${KNINFO[k].n}</b>.`);
  CAM.focus(kx,{r:74,zoom:2.6});
  FX.at("shock",kx,K.hex);FX.at("ring",kx,K.hex);sfx("gong");
  FX.banner({han:K.han,kicker:"Kỳ Ngộ · "+K.world,title:KNINFO[k].n,sub:KNINFO[k].d,color:K.hex});
  await sleep(850);
  if(k===3){
    for(let s=1;s<56;s++){const v=occupants((idx+s)%56).filter(x=>x.pi!==pi&&!tok(x).sh);if(v.length){
      CAM.focus(tokXY(v[0]),{r:70,zoom:2.7,phi:.95});await sleep(380);
      FX.at("bolt",tokXY(v[0]),"#9fd0ff");FX.flash("#cfe6ff");FX.shake();sfx("bolt");await sleep(320);
      sendHome(v[0]);log(`Thiên lôi giáng xuống ${tl(v[0])}, về chuồng.`);place();await sleep(600);return}}
    log("Phía trước không có quân địch nào.");
  } else if(k===1){
    FX.at("sparkle",kx,"#ffd76a");
    if(!(await exitToken(pi)))log("Không xuất thêm được quân nào.");
    else log(`Phật độ: ${nm(pi)} xuất thêm một quân.`);
  } else if(k===2){
    FX.at("swirl",kx,"#7fe08a");FX.at("sparkle",kx,"#bff2c2");
    drawCard(pi);await sleep(450);
  } else {
    const list=opps(pi).filter(i=>P(i).hand.length>0);
    FX.at("smoke",kx,"#6a1a1a");sfx("dark");
    if(!list.length){log("Không đối thủ nào còn bài để huỷ.");return}
    let t;
    if(P(pi).type==="bot")t=list.sort((a,b)=>P(b).hand.length-P(a).hand.length)[0];
    else t=await choosePlayer(pi,"Ma Lộ: huỷ bài của ai?",list,false);
    const h=P(t).hand;const id=h.splice(Math.floor(Math.random()*h.length),1)[0];G.discard.push(id);
    rowFx(t,"burn");CAM.release(300);
    log(`Lá <span class="lc" style="--cc:${FAC[CARDS[id].f].hex}">${CARDS[id].n}</span> của ${nm(t)} bị huỷ.`);
    FX.banner({small:true,han:"魔",kicker:"Bài bị thiêu huỷ",title:`${P(t).name} mất lá ${CARDS[id].n}`,color:FAC[0].hex});
    await sleep(400);
  }
}
async function executeMove(m){
  showPreview(null);G.busy=true;render();
  await moveCore(G.cur,m);
  G.busy=false;
  if(G.winner!=null)return endGame();
  finishTurn(isBonus(G.dice));
}
function passTurn(){if(G.busy)return;log(`${nm(G.cur)} không có nước đi.`);finishTurn(isBonus(G.dice))}
function phaseOK(w,ph){return w==="any"?(ph==="roll"||ph==="move"):w==="pre"?ph==="roll":ph==="move"}
function canPlay(pi,hi){
  if(!G||G.busy||G.select||G.cardUsed||G.winner!=null||pi!==G.cur)return false;
  const C=CARDS[P(pi).hand[hi]];return phaseOK(C.w,G.phase)&&C.can(pi);
}
async function useCard(pi,hi,args){
  const id=P(pi).hand[hi],C=CARDS[id];
  let a=args;
  if(!a){a=await C.ask(pi);if(!a){render();return false}}
  P(pi).hand.splice(P(pi).hand.indexOf(id),1);G.discard.push(id);G.cardUsed=true;
  log(`${nm(pi)} dùng phép <span class="lc" style="--cc:${FAC[C.f].hex}">${C.n}</span>.`);
  G.busy=true;render();
  FX.banner({han:FAC[C.f].han,kicker:FAC[C.f].card,title:C.n,sub:`${P(pi).name} thi triển`,color:FAC[C.f].hex});sfx("chime",C.f);
  {const fp=a&&(a.o?tokXY(a.o):a.a?tokXY(a.a):a.ti!=null?tokXY({pi,ti:a.ti}):null);if(fp){CAM.focus(fp,{r:76,zoom:2.5});await sleep(320)}}
  const fx=CFX[id];if(fx){try{fx[0](pi,a)}catch(e){}}
  await sleep(fx?fx[1]:350);
  await C.run(pi,a);
  if(["V3","N1","N2","N3","N4"].includes(id))dieFx(id==="V3"?"blessed":"green");
  if(G.winner==null){if(isHumanTurn())setTimeout(()=>{if(isHumanTurn()&&!G.busy&&!G.select)(G.phase==="move"?camAfterRoll:camTurnView)()},700);else CAM.release(700)}
  G.busy=false;
  if(G.winner!=null){endGame();return true}
  render();return true;
}
function endGame(){
  G.phase="over";G.busy=false;G.select=null;clearSave();render();
  const g=G,pl=P(G.winner),F=FAC[pl.fac];
  FX.banner({han:F.han,kicker:"Thỉnh kinh thành công",title:pl.name,sub:`${F.world} về Tây Thiên trước tiên`,color:F.hex,dur:1900});
  clearTimeout(CAM.rel);CAM.focus([75,75],{r:120,zoom:1.8,phi:.98,orbit:true});
  FX.confetti([F.hex,"#f3d791","#d6ab52","#fff4dc"]);FX.at("pillar",[75,75],"#f3d791",{h:95,life:2.2});FX.at("sparkle",[75,75],F.hex);sfx("win");
  if(NET.mode==="host")R("meta").update({status:"over"});
  setTimeout(()=>{if(G!==g||G.phase!=="over")return;openWinSheet()},2100);
}

/* ---------- Máy chơi ---------- */
async function botTurn(id){
  await sleep(700);
  if(!G||G.turnId!==id||G.phase!=="roll"||G.winner!=null)return;
  const pi=G.cur;
  await botCard(pi,"roll");
  if(G.winner!=null||G.turnId!==id)return;
  if(G.phase==="roll"){G.busy=true;render();const v=await animateRoll();G.busy=false;setRolled(v)}
  await sleep(450);
  if(G.turnId!==id)return;
  await botCard(pi,"move");
  if(G.winner!=null)return;
  await sleep(250);
  const ms=G.moves;
  if(ms.length){let best=ms[0],bs=-1e9;for(const m of ms){const s=scoreMove(pi,m);if(s>bs){bs=s;best=m}}await executeMove(best)}
  else{await sleep(400);passTurn()}
}
async function botCard(pi,ph){
  if(G.cardUsed)return;
  let best=null;
  P(pi).hand.forEach((id,hi)=>{const C=CARDS[id];if(!phaseOK(C.w,ph)||!C.can(pi))return;const r=C.bot(pi);if(r&&r.val>=10&&(!best||r.val>best.val))best={hi,...r}});
  if(best&&Math.random()<.85){await useCard(pi,best.hi,best.args);await sleep(450)}
}

function dieSVG(v,cls=""){
  const Q={tl:[11,11],tr:[29,11],ml:[11,20],mr:[29,20],c:[20,20],bl:[11,29],br:[29,29]};
  const M={1:["c"],2:["tl","br"],3:["tl","c","br"],4:["tl","tr","bl","br"],5:["tl","tr","c","bl","br"],6:["tl","tr","ml","mr","bl","br"]};
  const inner=v==null?`<text x="20" y="20.5" class="die-q">?</text>`:M[v]?M[v].map(k=>`<circle cx="${Q[k][0]}" cy="${Q[k][1]}" r="3.3"/>`).join(""):`<text x="20" y="20.5" class="die-n">${v}</text>`;
  return `<svg viewBox="0 0 40 40" class="die ${cls}" aria-label="Xúc xắc ${v??"chưa đổ"}"><rect x="1.5" y="1.5" width="37" height="37" rx="8"/>${inner}</svg>`;
}
function buildTokens(){
  const layer=$("#tokLayer");layer.innerHTML="";
  tokEls=G.players.map((pl,pi)=>pl.tokens.map((t,ti)=>{
    const g=document.createElementNS(NS,"g");g.setAttribute("class","tok");g.setAttribute("tabindex","0");
    const C=CHARS[pl.fac][ti];
    g.innerHTML=`<title>${C.n} · ${FAC[pl.fac].world}</title><circle class="tok-ring" r="5.3"/><circle class="tok-shield" r="4.8"/><circle class="tok-body" r="3.7" fill="${FAC[pl.fac].hex}"/><circle class="tok-rim" r="3.7"/><text class="tok-t">${C.s}</text>`;
    g.addEventListener("click",()=>onTok(pi,ti));
    g.addEventListener("pointerenter",()=>showPreview(moveTarget(pi,ti)));g.addEventListener("pointerleave",()=>showPreview(null));
    g.addEventListener("focus",()=>showPreview(moveTarget(pi,ti)));g.addEventListener("blur",()=>showPreview(null));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onTok(pi,ti)}});
    layer.appendChild(g);return g;
  }));
  if(V3.ok){V3.toks=null;if(V3.on)V3.build()}
}
function selectable(){
  if(!G)return new Set();
  if(G.select)return localSeat(G.select.seat??G.cur)?G.select.keys:new Set();
  if(G.phase==="move"&&!G.busy&&localSeat(G.cur))return new Set(G.moves.map(m=>G.cur+"_"+m.ti));
  return new Set();
}
function place(){
  if(!G)return;
  const groups=new Map();
  G.players.forEach((pl,pi)=>pl.tokens.forEach((t,ti)=>{
    let key,x,y;
    if(t.p<0){const[bx,by]=BASEO[pl.fac],[sx,sy]=SLOTS[ti];key="b"+pi+"_"+ti;x=bx+sx;y=by+sy}
    else{const[r,c]=cellRC(pl.fac,t.p);key=r+"_"+c;x=c*10+5;y=r*10+5}
    if(!groups.has(key))groups.set(key,{x,y,l:[]});groups.get(key).l.push([pi,ti]);
  }));
  const can=selectable();
  for(const g of groups.values()){
    const n=g.l.length;
    g.l.forEach(([pi,ti],i)=>{
      let dx=0,dy=0,s=1;
      if(n>1){s=n>4?.5:.66;const a=i/n*Math.PI*2-Math.PI/2,rad=n>4?3:2.3;dx=Math.cos(a)*rad;dy=Math.sin(a)*rad}
      const el=tokEls[pi][ti],t=P(pi).tokens[ti];
      el.style.transform=`translate(${(g.x+dx).toFixed(2)}px,${(g.y+dy).toFixed(2)}px) scale(${s})`;
      el.classList.toggle("can",can.has(pi+"_"+ti));
      el.classList.toggle("sh",!!t.sh);
      el.classList.toggle("done",t.p===61);
      if(V3.on)V3.set(pi,ti,g.x+dx,g.y+dy,s,can.has(pi+"_"+ti),!!t.sh);
    });
  }
  if(V3.on)V3.turn(G.winner==null?P(G.cur).fac:-1);
  for(let f=0;f<4;f++){const r=document.getElementById("bring"+f);if(r)r.classList.toggle("on",!!G&&G.winner==null&&P(G.cur).fac===f)}
  netDirty();
}

  else if(G.phase==="roll"){status=(NET.mode?"Lượt của bạn. ":"")+"Đổ xúc xắc để đi. Đổ 1 hoặc 6 để xuất quân và được đổ thêm lượt.";acts=`<button class="btn primary" data-act="roll" ${G.busy?"disabled":""}>Đổ xúc xắc</button>`}

    <div class="turn-body"><div id="die" class="${dieCls()}">${dieSVG(G.dice,"big")}</div><div style="min-width:0"><p class="status">${status}</p><div class="acts">${acts}</div></div></div></div>`;
  lastTurnShown=G.turnId;
}

function onTok(pi,ti){
  if(!G)return;
  if(G.select){if(localSeat(G.select.seat??G.cur)&&G.select.keys.has(pi+"_"+ti)){if(NET.mode==="client"){netIntent("pick",{pi,ti});G.select=null;place()}else resolveSelect({pi,ti})}return}
  if(G.phase!=="move"||G.busy||pi!==G.cur||!localSeat(pi))return;
  const m=G.moves.find(x=>x.ti===ti);if(!m)return;
  if(NET.mode==="client"){netIntent("move",{ti});G.busy=true;showPreview(null);place();renderTurn()}else executeMove(m);
}
document.addEventListener("click",e=>{

  const gl=e.target.closest("[data-gal]");

  if(pick){const r=modalRes;modalRes=null;$("#modal").hidden=true;if(r)r(+pick.dataset.pick);return}
  const rc=e.target.closest("[data-rchoose]");
  if(rc){netIntent("choose",{i:+rc.dataset.rchoose});closeSheet();return}

  if(card&&!card.disabled){if(NET.mode==="client"){netIntent("card",{hi:+card.dataset.card});G.busy=true;renderHand()}else useCard(G.cur,+card.dataset.card);return}
  const b=e.target.closest("[data-act]");if(!b)return;

  if(a==="roll")humanRoll();
  else if(a==="pass"){if(NET.mode==="client")netIntent("pass");else passTurn()}
  else if(a==="cancelSel"&&G&&G.select){if(NET.mode==="client")netIntent("cancel");else resolveSelect(null)}
  else if(a.startsWith("net"))netAction(a,b);
  else if(a==="tabLocal"||a==="tabOnline")setupTab(a==="tabOnline"?"online":"local");
  else if(a==="install")doInstall();
  else if(a==="close")closeSheet();
  else if(a==="sound")toggleSound();
  else if(a==="music")toggleMusic();
  else if(a==="cam")toggleCam();
  else if(modalRes)return;
  else if(a==="setup")openSetup(NET.code?"online":"local");

  else if(a==="spells")openSpells();

  else if(a==="start")startFromSetup();

});

  <div class="opts"><button class="btn primary" data-act="close">Đóng</button></div>`);
}

/* Cờ Thỉnh Kinh — 20 quân cờ chibi anime dựng bằng khối cơ bản.
   Đơn vị: đế bán kính 1, cao ~2–2.5. Trục Y hướng lên, mặt nhân vật nhìn về +Z.
   opt.outline = viền anime (chỉ dùng trong game, không xuất STL). */
function buildFigure(THREE, f, i, opt) {
  opt = opt || {};
  const PI = Math.PI;
  const root = new THREE.Group();
  let cur = root;
  if (!buildFigure._g) {
    const d = new Uint8Array([110, 110, 110, 255, 178, 178, 178, 255, 236, 236, 236, 255]);
    const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
    t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
    buildFigure._g = t;
  }
  const mats = {};
  const M = c => mats[c] || (mats[c] = new THREE.MeshToonMaterial({ color: c, gradientMap: buildFigure._g }));
  const GOLD = "#e8b84a", INK = "#2a1830", WHITE = "#ffffff";
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  function put(geo, col, p, r, s) {
    const m = new THREE.Mesh(geo, M(col));
    if (p) m.position.set(p[0], p[1], p[2]);
    if (r) m.rotation.set(r[0], r[1], r[2]);
    if (s) m.scale.set(s[0], s[1], s[2]);
    m.castShadow = true; m.receiveShadow = true;
    cur.add(m); return m;
  }
  const ol = m => (m.userData.ol = true, m);
  const sph = (r, col, p, s, rot) => put(new THREE.SphereGeometry(r, 24, 16), col, p, rot, s);
  const cone = (r, h, col, p, rot) => put(new THREE.ConeGeometry(r, h, 16), col, p, rot);
  const cyl = (r1, r2, h, col, p, rot) => put(new THREE.CylinderGeometry(r1, r2, h, 20), col, p, rot);
  const box = (w, h, d, col, p, rot) => put(new THREE.BoxGeometry(w, h, d), col, p, rot);
  const torus = (R, t, col, p, rot, arc) => put(new THREE.TorusGeometry(R, t, 10, 32, arc || PI * 2), col, p, rot);
  const lathe = (pts, col, p) => put(new THREE.LatheGeometry(pts.map(a => new THREE.Vector2(a[0], a[1])), 32), col, p);
  function rod(a, b, r, col) {
    const A = V(a[0], a[1], a[2]), B = V(b[0], b[1], b[2]), d = B.clone().sub(A), L = d.length();
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, L, 6, 12), M(col));
    m.position.copy(A).add(B).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
    m.castShadow = true; m.receiveShadow = true;
    cur.add(m); return m;
  }
  const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

  /* đế */
  const FACC = ["#d1432f", "#e3a514", "#3f9d5b", "#3a7bd0"];
  lathe([[0, 0], [1, 0], [1, .1], [.9, .22], [0, .22]], opt.baseColor || FACC[f]);
  torus(.955, .035, GOLD, [0, .1, 0], [PI / 2, 0, 0]);

  /* thân chibi: đầu to, thân chuông ngắn */
  function body(o) {
    const s = o.s || 1, fat = o.fat || 0, top = .22, H = .74 * s;
    ol(lathe([[0, top], [.48 + fat, top], [.5 + fat, top + .1 * s], [.45 + fat, top + .38 * s], [.33 + fat * .6, top + .6 * s], [.2, top + H - .02], [0, top + H]], o.robe));
    torus(.455 + fat * .95, .04, o.trim, [0, top + .36 * s, 0], [PI / 2, 0, 0]);
    torus(.2, .035, o.trim, [0, top + H - .03, 0], [PI / 2, 0, 0]);
    const hr = (o.headR || .46) * (s < 1 ? .96 : 1), hc = top + H + hr * .86;
    ol(sph(hr, o.skin, [0, hc, 0], [1.04, 1, 1]));
    const shY = top + .6 * s, sw = .26 + fat * .6;
    const hand = o.hands || [[-(.42 + fat), top + .34 * s, .26], [.42 + fat, top + .34 * s, .26]];
    rod([-sw, shY, 0], hand[0], .1, o.sleeve || o.robe);
    rod([sw, shY, 0], hand[1], .1, o.sleeve || o.robe);
    sph(.1, o.skin, hand[0]); sph(.1, o.skin, hand[1]);
    if (!o.noFeet) for (const k of [-1, 1]) sph(.12, o.shoe || "#3a2820", [k * .17, top + .05, .38], [1, .7, 1.3]);
    const b = { top, hc, hr, hand, shY, s, fat, neck: top + H };
    b.z = (x, dy) => Math.sqrt(Math.max(0, hr * hr - (x / 1.04) ** 2 - dy * dy));
    if (!o.noFace) face(b, o);
    return b;
  }
  function face(b, o) {
    const dy = -b.hr * .08, ey = b.hc + dy;
    for (const k of [-1, 1]) {
      const x = k * .17, z = b.z(x, dy);
      if (o.closed) torus(.065, .016, INK, [x, ey, z + .005], [0, 0, o.closed === "happy" ? 0 : PI], PI);
      else {
        sph(.085, o.eye || INK, [x, ey, z - .015], [1, 1.35, .45]);
        sph(.028, WHITE, [x + .03, ey + .045, b.z(x + .03, dy + .045) + .01]);
      }
      sph(.06, "#f6a2a2", [k * .3, ey - .12, b.z(k * .3, dy - .12) - .02], [1, .55, .3]);
    }
    if (o.mouth !== false) {
      const my = dy - .18;
      torus(o.smile || .045, .014, "#8a3434", [0, b.hc + my, b.z(0, my) + .005], [0, 0, PI], PI);
    }
  }
  function hair(b, col, o) {
    o = o || {};
    ol(sph(b.hr * 1.06, col, [0, b.hc + b.hr * .1, -b.hr * .1], [1.04, .96, 1]));
    if (o.bangs !== false) for (let k = -2; k <= 2; k++) {
      const x = k * b.hr * .24, dy = b.hr * (.6 - Math.abs(k) * .06);
      sph(b.hr * .22, col, [x, b.hc + dy, b.z(x, dy) - .02], [1, 1.35, .6], [0, 0, -k * .25]);
    }
    if (o.long) ol(rod([0, b.hc, -b.hr * .7], [0, b.hc - b.hr * 1.5, -b.hr * .85], b.hr * .48, col));
  }
  const ears = (b, col, sc) => { for (const k of [-1, 1]) sph(.09, col, [k * b.hr * 1.03, b.hc - .02, 0], sc || [.6, 1.35, .8]); };
  const staff = (h, y1, col, r) => rod([h[0], .26, h[2]], [h[0], y1, h[2]], r || .055, col);

  const C = [
    /* ===== MA ===== */
    [
      () => { // Ngưu Ma Vương
        const b = body({ robe: "#5a2424", trim: GOLD, skin: "#ffd9c2", fat: .08, eye: "#7a1010" });
        hair(b, "#231a1a");
        for (let k = -1; k <= 1; k++) cone(.1, .28, "#231a1a", [k * .17, b.hc + b.hr * .98, -.06], [0, 0, -k * .45]);
        for (const k of [-1, 1]) {
          rod([k * .36, b.hc + .2, -.02], [k * .62, b.hc + .36, -.02], .075, "#f4e8cc");
          cone(.075, .3, "#f4e8cc", [k * .69, b.hc + .52, -.02], [0, 0, -k * .35]);
          sph(.1, "#ffd9c2", [k * .5, b.hc + .02, -.04], [1.3, .55, .6]);
          sph(.15, "#7a3a2a", [k * .33, b.shY + .02, 0], [1, .7, 1]);
        }
        torus(.05, .015, GOLD, [0, b.hc - .2, b.z(0, -.2) + .01]);
        const h = b.hand[1]; staff(h, 2.2, "#2b2b2b", .06); sph(.1, GOLD, [h[0], 2.24, h[2]]);
      },
      () => { // Thiết Phiến Công Chúa
        const b = body({ robe: "#b8324a", trim: "#f0c24a", skin: "#ffe2cc", eye: "#5a1020", hands: [[-.42, .56, .26], [.44, .84, .3]] });
        hair(b, "#1c1414", { long: true });
        sph(.17, "#1c1414", [0, b.hc + b.hr + .04, -.12]);
        rod([-.24, b.hc + b.hr + .06, -.12], [.24, b.hc + b.hr + .1, -.12], .025, GOLD);
        sph(.05, "#e04a5a", [.24, b.hc + b.hr + .1, -.12]);
        const h = b.hand[1];
        rod(h, add3(h, [.04, .28, 0]), .035, GOLD);
        sph(.42, "#4aa35a", add3(h, [.1, .66, 0]), [.85, 1, .12]);
        rod(add3(h, [.05, .3, .03]), add3(h, [.16, 1.0, .03]), .02, "#2f7a3a");
      },
      () => { // Hồng Hài Nhi
        const b = body({ robe: "#e0402e", trim: "#ffc23a", skin: "#ffe0c4", s: .9, eye: "#8a1a10", smile: .06 });
        hair(b, "#1c1414", { bangs: false });
        sph(.14, "#1c1414", [0, b.hc + b.hr + .02, 0]);
        for (const k of [-1, 1]) sph(.12, "#1c1414", [k * .3, b.hc + b.hr * .72, 0]);
        const h = b.hand[1]; staff(h, 1.95, "#7a4a1a", .05);
        cone(.08, .28, "#e9edf2", [h[0], 2.1, h[2]]);
        cone(.12, .3, "#ff8a2a", [h[0], 1.88, h[2]], [PI, 0, 0]);
        for (let k = 0; k < 3; k++) { const a = PI * .25 + k * PI * .25; cone(.1, .34, k === 1 ? "#ffcf3a" : "#ff7a2a", [Math.cos(a) * .74, .38, Math.sin(a) * .74]); }
      },
      () => { // Bạch Cốt Tinh

        const h = b.hand[1]; staff(h, 1.95, "#e9e4d8", .05);
        sph(.15, "#f4f1e8", [h[0], 2.06, h[2]]);

      },
      () => { // Hoàng Mi Đại Vương

        for (const k of [-1, 1]) rod([k * .07, b.hc + .1, b.z(.07, .1)], [k * .36, b.hc - .05, b.z(.34, -.05) - .02], .04, "#f5d442");
        for (const k of [-1, 1]) cyl(.26, .26, .05, GOLD, add3(b.hand[k < 0 ? 0 : 1], [k * .06, .1, 0]), [0, 0, PI / 2]);
        torus(.24, .04, "#6b3a12", [0, b.neck, .06], [PI / 2 - .35, 0, 0]);

    ],
    /* ===== PHẬT ===== */
    [
      () => { // Như Lai Phật Tổ — ngồi toà sen
        for (let k = 0; k < 10; k++) { const a = k / 10 * PI * 2; put(new THREE.SphereGeometry(.26, 16, 12), "#f6aab8", [Math.cos(a) * .64, .32, Math.sin(a) * .64], [0, -a, 0], [1, .45, .55]); }
        ol(lathe([[0, .3], [.56, .3], [.53, .48], [.36, .64], [.22, .8], [0, .82]], "#e0a832"));
        for (const k of [-1, 1]) rod([k * .27, .7, 0], [k * .1, .5, .36], .1, "#e0a832");
        sph(.12, "#ffe0b8", [0, .5, .4]);
        const hr = .46, hc = .82 + hr * .86;
        const b = { hr, hc, z: (x, dy) => Math.sqrt(Math.max(0, hr * hr - (x / 1.04) ** 2 - dy * dy)) };
        ol(sph(hr, "#ffe0b8", [0, hc, 0], [1.04, 1, 1]));
        face(b, { closed: true });
        hair(b, "#2b3a6a", { bangs: false });
        sph(.2, "#2b3a6a", [0, hc + hr * .95, -.04]);
        sph(.035, "#d0302a", [0, hc + hr * .3, b.z(0, hr * .3) + .01]);
        ears(b, "#ffe0b8", [.55, 1.6, .7]);
        torus(.66, .05, GOLD, [0, hc, -.46]);
        rod([0, .78, -.3], [0, hc - .66, -.46], .06, GOLD);
      },
      () => { // Quan Âm Bồ Tát

        for (const dy of [.5, .62, .74]) sph(.05, "#7fbf5a", add3(h, [-.08 + dy * .02, dy, .05]), [1, 1.8, .5], [0, 0, .5]);

    /* ===== NHÂN ===== */
    [

/* bộ giả lập Firebase chạy giữa các tab trên cùng máy — dùng để thử nghiệm khi mở với ?net=local */
function localBackend(){
  const ch=new BroadcastChannel("ctk-net");let tree={};try{tree=JSON.parse(localStorage.getItem("ctk-net-tree")||"{}")}catch(e){}
  const subs=[],split=p=>p.split("/").filter(Boolean),clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
  const get=p=>{let n=tree;for(const k of split(p)){if(n==null||typeof n!=="object")return null;n=n[k]}return n===undefined?null:n};
  const put=(p,v)=>{const ks=split(p);let n=tree;for(let i=0;i<ks.length-1;i++){if(n[ks[i]]==null||typeof n[ks[i]]!=="object")n[ks[i]]={};n=n[ks[i]]}if(v==null)delete n[ks[ks.length-1]];else n[ks[ks.length-1]]=clone(v)};
  const snap=(p,v)=>({key:split(p).pop()||null,val:()=>clone(v),exists:()=>v!=null});
  const related=(a,b)=>a===b||a.startsWith(b+"/")||b.startsWith(a+"/");
  const emit=s=>{if(s.ev==="value"){s.cb(snap(s.path,get(s.path)));return}const v=get(s.path)||{};
    for(const k of Object.keys(v).sort()){if(s.known.has(k)||(s.start!=null&&k<s.start))continue;s.known.add(k);s.cb(snap(s.path+"/"+k,v[k]))}
    for(const k of [...s.known])if(!(k in v))s.known.delete(k)};
  const fire=p=>{for(const s of subs.slice())if(related(s.path,p))emit(s)};
  const write=(p,v)=>{put(p,v);try{localStorage.setItem("ctk-net-tree",JSON.stringify(tree))}catch(e){}ch.postMessage({p,v:clone(v)});fire(p);return Promise.resolve()};
  ch.onmessage=e=>{put(e.data.p,e.data.v);fire(e.data.p)};
  let ctr=0;const pushKey=()=>Date.now().toString(36).padStart(9,"0")+(ctr++).toString(36).padStart(4,"0")+Math.random().toString(36).slice(2,6);
  const ref=(p,start)=>({key:split(p).pop()||null,
    set:v=>write(p,v),update:o=>{for(const k in o)write(p+"/"+k,o[k]);return Promise.resolve()},remove:()=>write(p,null),
    push(v){const r=ref(p+"/"+pushKey());if(v!==undefined)write(p+"/"+r.key,v);return r},
    once:()=>Promise.resolve(snap(p,get(p))),
    on(ev,cb){if(p===".info/connected"){setTimeout(()=>cb({val:()=>true}),0);return cb}const s={path:p,ev,cb,known:new Set(),start};subs.push(s);setTimeout(()=>emit(s),0);return cb},
    off(ev,cb){for(let i=subs.length-1;i>=0;i--)if(subs[i].path===p&&(!ev||subs[i].ev===ev)&&(!cb||subs[i].cb===cb))subs.splice(i,1)},
    transaction(fn){const cur=get(p),nv=fn(clone(cur));if(nv===undefined)return Promise.resolve({committed:false,snapshot:snap(p,cur)});write(p,nv);return Promise.resolve({committed:true,snapshot:snap(p,nv)})},
    onDisconnect:()=>({update:()=>Promise.resolve(),set:()=>Promise.resolve(),remove:()=>Promise.resolve(),cancel:()=>Promise.resolve()}),
    orderByKey(){return ref(p,start)},startAt(k){return ref(p,k)},limitToLast(){return ref(p,start)}});
  let uid=null;try{uid=sessionStorage.getItem("ctk-uid")}catch(e){}
  if(!uid){uid="u"+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem("ctk-uid",uid)}catch(e){}}
  return {db:{ref:p=>ref(p)},auth:()=>Promise.resolve(uid),TS:null,local:true};
}

function snapPublic(){return {players:G.players.map(p=>({fac:p.fac,name:p.name,type:p.type,uid:p.uid||null,tokens:p.tokens,handN:p.hand.length,skip:p.skip,halve:p.halve})),
  cur:G.cur,phase:G.phase,dice:G.dice,moves:G.moves,cardUsed:G.cardUsed,deckN:G.deck.length,log:G.log.slice(0,40),winTarget:G.winTarget,winner:G.winner,busy:G.busy,turnId:G.turnId,sixes:G.sixes,
  select:G.select?{keys:[...G.select.keys],prompt:G.select.prompt,seat:G.select.seat}:null,choice:G.choice||null}}
function netDirty(){if(NET.mode!=="host"||!G||NET.timer)return;NET.timer=setTimeout(netFlush,60)}
function netFlush(){
  NET.timer=null;if(NET.mode!=="host"||!G||!NET.code)return;
  R("state").set({j:JSON.stringify(snapPublic()),v:++NET.ver});
  for(const p of G.players)if(p.type==="human"&&p.uid&&p.uid!==NET.uid){const h=JSON.stringify(p.hand);if(NET.lastHands[p.uid]!==h){NET.lastHands[p.uid]=h;R("priv/"+p.uid).set(h)}}
  const now=Date.now();
  if(now-NET.lastFull>1000){NET.lastFull=now;R("host").set(JSON.stringify({...G,select:null,choice:null,busy:false,moves:[]}))}
  else if(!NET.fullT)NET.fullT=setTimeout(()=>{NET.fullT=null;NET.lastFull=0;netDirty()},1100);
}

function netIntent(k,d){if(NET.mode!=="client"||!NET.code)return;R("intents").push({uid:NET.uid,k,d:JSON.stringify(d||{}),t:NET_TS()})}
function netOnIntent(s){
  const it=s.val();R("intents/"+s.key).remove();
  if(!it||!G||NET.mode!=="host"||G.winner!=null)return;
  let d={};try{d=JSON.parse(it.d||"{}")}catch(e){}
  const seat=G.players.findIndex(p=>p.type==="human"&&p.uid===it.uid);if(seat<0)return;
  NET.offSince[it.uid]=0;
  if(it.k==="roll"){if(seat===G.cur)humanRoll(true)}
  else if(it.k==="pass"){if(seat===G.cur&&G.phase==="move"&&!G.busy&&!G.select&&!G.moves.length)passTurn()}
  else if(it.k==="move"){if(seat===G.cur&&G.phase==="move"&&!G.busy&&!G.select){const m=G.moves.find(x=>x.ti===+d.ti);if(m)executeMove(m)}}
  else if(it.k==="card"){if(seat===G.cur&&canPlay(seat,+d.hi))useCard(seat,+d.hi)}
  else if(it.k==="pick"){if(G.select&&G.select.seat===seat&&G.select.keys.has(d.pi+"_"+d.ti))resolveSelect({pi:+d.pi,ti:+d.ti})}
  else if(it.k==="cancel"){if(G.select&&G.select.seat===seat)resolveSelect(null)}
  else if(it.k==="choose"){if(G.choice&&G.choice.seat===seat&&NET.choiceRes){const r=NET.choiceRes;NET.choiceRes=null;G.choice=null;r(+d.i);render()}}
}

/* người chơi vắng mặt quá 15 giây đúng lượt của mình thì máy đánh thay lượt đó */
function netWatchdog(){
  if(NET.mode!=="host"||!G||G.winner!=null||G.phase==="over"||!remoteSeat(G.cur))return;
  const uid=P(G.cur).uid;if(isOnline(uid)){NET.offSince[uid]=0;return}
  if(!NET.offSince[uid])NET.offSince[uid]=Date.now();
  if(Date.now()-NET.offSince[uid]<15000||G.busy||NET.autoTurn===G.turnId)return;
  NET.autoTurn=G.turnId;log(`${nm(G.cur)} mất kết nối, máy đánh thay lượt này.`);
  if(G.choice&&NET.choiceRes){const r=NET.choiceRes;NET.choiceRes=null;G.choice=null;r(0);return}
  if(G.select){resolveSelect(null);return}
  if(G.phase==="roll")botTurn(G.turnId);
  else if(G.phase==="move"){const ms=G.moves;if(!ms.length)passTurn();else{let b=ms[0],bs=-1e9;for(const m of ms){const sc=scoreMove(G.cur,m);if(sc>bs){bs=sc;b=m}}executeMove(b)}}
}

function netErr(e){const c=(e&&(e.code||e.message))||"";
